name: Copy Secrets to Live Repo

on:
  workflow_dispatch:

jobs:
  transfer-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate and Transfer
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          SOURCE_REPO: "SAWAJ-STUDIO-LAB/ON"
          TARGET_REPO: "SAWAJ-STUDIO-LAB/Live"
        run: |
          # GitHub CLI authenticate
          echo "$GH_TOKEN" | gh auth login --with-token

          # 1. Source Repo ke saare Secrets ki list nikalein
          SECRET_NAMES=$(gh secret list --repo "$SOURCE_REPO" --json name -q '.[].name')

          echo "Found secrets: $SECRET_NAMES"

          # 2. Har secret ka naam Target Repo (Live) me create karein
          for secret in $SECRET_NAMES; do
            echo "Creating secret name in Live repo: $secret"
            gh secret set "$secret" --repo "$TARGET_REPO" --body "PLACEHOLDER_VALUE"
          done

          echo "All secret placeholders copied to Live Repo!"
