name: Trigger Private API Tests

on:
  workflow_dispatch:
    inputs:
      api_list:
        description: 'Enter API names (e.g. gemini_test) or type "All"'
        required: true
        default: 'All'

jobs:
  trigger_private:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Private Repo
        run: |
          echo "Public repo se Private repo ko trigger kar rahe hain: ${{ github.event.inputs.api_list }}"
          
          # Yahan URL mein repo ka naam 'Hard-disk' hi rahega kyunki private repo ka naam wahi hai
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.TOKEN_GITHUB }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/SAWAJ-STUDIO-LAB/Hard-disk/actions/workflows/test.yml/dispatches \
            -d '{"ref":"main","inputs":{"api_list":"${{ github.event.inputs.api_list }}"}}'
