name: "🟢Story Video"

on:
  workflow_dispatch: # Manual run
  schedule:
    - cron: '30 23 * * *'   # 5:00 AM IST

permissions:
  contents: write
  actions: write

concurrency:
  group: morning-story
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-tools
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Custom Fonts
        id: cache-fonts
        uses: actions/cache@v4
        with:
          path: ~/.fonts
          key: ${{ runner.os }}-custom-fonts

      - name: Install System Setup (FFmpeg)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto fonts-noto-core fonts-noto-extra fonts-noto-ui-core fonts-dejavu-core fonts-noto-color-emoji fontconfig

      - name: Download Custom Fonts (only if cache miss)
        if: steps.cache-fonts.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.fonts
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf" -O ~/.fonts/NotoSans-Regular.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf" -O ~/.fonts/NotoSans-Bold.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf" -O ~/.fonts/NotoSansDevanagari-Regular.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf" -O ~/.fonts/NotoSansDevanagari-Bold.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf" -O ~/.fonts/NotoNaskhArabic-Regular.ttf || true
          wget -q --timeout=20 "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Bold.ttf" -O ~/.fonts/NotoNaskhArabic-Bold.ttf || true

      - name: Install Python Packages & Refresh Fonts
        run: |
          fc-cache -f -v
          pip install --no-cache-dir requests edge-tts mutagen Pillow google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run Story Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          DRIVE_STORY_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_AI }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_AI }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY_AI }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
          
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 << 'PYEOF'
          import os, re, time, random, subprocess, requests, shutil, sys, datetime
          from mutagen.mp3 import MP3
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          session = requests.Session()
          retry = Retry(total=3, backoff_factor=1.5, status_forcelist=[429,500,502,503,504])
          session.mount("https://", HTTPAdapter(max_retries=retry))

          TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          TG_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")

          api_status = {"AI": {}, "TTS": {}, "Music": {}, "Background": {}, "Translation": {}, "Hadith": {}, "Drive": {}}

          def send_tg(msg):
              if TG_TOKEN and TG_CHAT_ID:
                  try:
                      session.post(f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage", json={"chat_id": TG_CHAT_ID, "text": msg, "parse_mode": "HTML", "disable_web_page_preview": True}, timeout=12)
                  except: pass
              print(msg)

          def run_cmd(cmd):
              print(f"[CMD] {cmd[:140]}...")
              subprocess.run(cmd, shell=True, check=True)

          def sanitize(t):
              if not t: return ""
              t = re.sub(r'[\u200b-\u200f\ufeff\u202a-\u202e]', '', str(t))
              return t.replace('"', '').replace("'", '').replace('\n', ' ').strip()

          def report_api_status():
              lines = ["📊 <b>API STATUS REPORT</b>\n"]
              for section, status in api_status.items():
                  if not status: continue
                  lines.append(f"<b>{section}:</b>")
                  for name, result in status.items():
                      icon = "✅" if result == "success" else "❌" if "failed" in str(result) else "⏸️"
                      lines.append(f"  {icon} {name} → {result}")
              send_tg("\n".join(lines))

          try:
              send_tg("🌍 <b>ULTIMATE GLOBAL NO.1 STORY STARTED</b>\n🎬 Cinematic Visuals | Studio Audio | Strict Islamic")

              # ---------------- 1. AI & TRANSLATION ----------------
              def call_ai(prompt, max_tokens=400, task="general"):
                  providers = []
                  if os.environ.get("OPENROUTER_API_KEY"): providers.append(("OpenRouter", "https://openrouter.ai/api/v1/chat/completions", {"Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}"}, "openai/gpt-4o-mini"))
                  if os.environ.get("GROQ_API_KEY"): providers.append(("Groq", "https://api.groq.com/openai/v1/chat/completions", {"Authorization": f"Bearer {os.environ['GROQ_API_KEY']}"}, "llama-3.3-70b-versatile"))
                  if os.environ.get("NVIDIA_API_KEY"): providers.append(("NVIDIA", "https://integrate.api.nvidia.com/v1/chat/completions", {"Authorization": f"Bearer {os.environ['NVIDIA_API_KEY']}"}, "meta/llama3-70b-instruct"))
                  if os.environ.get("MISTRAL_API_KEY"): providers.append(("Mistral", "https://api.mistral.ai/v1/chat/completions", {"Authorization": f"Bearer {os.environ['MISTRAL_API_KEY']}"}, "mistral-small-latest"))
                  
                  for name, url, headers, model in providers:
                      try:
                          payload = {"model": model, "messages": [{"role": "user", "content": prompt}], "temperature": 0.7, "max_tokens": max_tokens}
                          r = session.post(url, headers={**headers, "Content-Type": "application/json"}, json=payload, timeout=40)
                          if r.status_code == 200: 
                              api_status["AI"][f"{name}"] = "success"
                              return r.json()["choices"][0]["message"]["content"].strip()
                          api_status["AI"][f"{name}"] = "failed"
                      except Exception as e: api_status["AI"][f"{name}"] = f"failed"
                  return None

              def translate_text(text):
                  key = os.environ.get("DEEPL_API_KEY")
                  if key:
                      try:
                          r = session.post("https://api-free.deepl.com/v2/translate", headers={"Authorization": f"DeepL-Auth-Key {key}"}, data={"text": text, "target_lang": "HI"}, timeout=20)
                          if r.status_code == 200: api_status["Translation"]["DeepL"] = "success"; return r.json()["translations"][0]["text"]
                      except: pass
                      api_status["Translation"]["DeepL"] = "failed"
                  sarvam_key = os.environ.get("SARVAM_API_KEY")
                  if sarvam_key:
                      try:
                          r = session.post("https://api.sarvam.ai/translate", headers={"api-subscription-key": sarvam_key, "Content-Type": "application/json"}, json={"input": text, "source_language_code": "en-IN", "target_language_code": "hi-IN", "speaker_gender": "Male"}, timeout=20)
                          if r.status_code == 200: api_status["Translation"]["Sarvam"] = "success"; return r.json().get("translated_text", "")
                      except: pass
                      api_status["Translation"]["Sarvam"] = "failed"
                  return call_ai(f"Is English Hadith ka soft accurate Hindi tarjuma likho. Sirf tarjuma.\n\n{text}", task="hindi")

              # ---------------- 2. HADITH ----------------
              def fetch_hadith():
                  books = [{"eng": "eng-bukhari", "ara": "ara-bukhari", "name": "Sahih al-Bukhari", "max": 7000}, {"eng": "eng-muslim", "ara": "ara-muslim", "name": "Sahih Muslim", "max": 5000}]
                  bases = []
                  if os.environ.get("HADITH_API_URL"): bases.append(os.environ["HADITH_API_URL"].rstrip("/"))
                  bases += ["https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1", "https://raw.githubusercontent.com/fawazahmed0/hadith-api/1"]
                  book = random.choice(books)
                  num = random.randint(1, book["max"])
                  for base in bases:
                      try:
                          url = f"{base}/editions/{book['eng']}/{num}.json"
                          r = session.get(url, timeout=15)
                          if r.status_code != 200: continue
                          data = r.json()
                          hs = data.get("hadiths", [])
                          if not hs: continue
                          eng = sanitize(hs[0].get("text", ""))
                          if len(eng) < 30: continue
                          ara = ""
                          try:
                              ar = session.get(url.replace(book["eng"], book["ara"]), timeout=10)
                              if ar.status_code == 200:
                                  ad = ar.json().get("hadiths", [])
                                  if ad: ara = sanitize(ad[0].get("text", ""))
                          except: pass
                          api_status["Hadith"]["API"] = "success"
                          return {"collection": book["name"], "number": str(hs[0].get("hadithnumber") or num), "english": eng, "arabic": ara}
                      except: pass
                  api_status["Hadith"]["API"] = "failed"
                  return None

              # ---------------- 3. TTS ----------------
              def gen_tts(text, outfile):
                  text = sanitize(text)
                  el = os.environ.get("ELEVENLABS_API_KEY")
                  if el:
                      try:
                          r = session.post("https://api.elevenlabs.io/v1/text-to-speech/pNInz6obpgDQGcFmaJgB", headers={"Accept": "audio/mpeg", "Content-Type": "application/json", "xi-api-key": el}, json={"text": text, "model_id": "eleven_multilingual_v2"}, timeout=50)
                          if r.status_code == 200 and len(r.content) > 5000: open(outfile, "wb").write(r.content); api_status["TTS"]["ElevenLabs"] = "success"; return True
                      except: pass
                      api_status["TTS"]["ElevenLabs"] = "failed"
                  try:
                      tmp = outfile + ".txt"
                      open(tmp, "w", encoding="utf-8").write(text)
                      run_cmd(f'edge-tts --file "{tmp}" --write-media "{outfile}" --voice hi-IN-MadhurNeural --rate=-7% --pitch=-2Hz --volume=+8%')
                      if os.path.exists(tmp): os.remove(tmp)
                      api_status["TTS"]["edge-tts"] = "success"; return True
                  except: api_status["TTS"]["edge-tts"] = "failed"; return False

              # ---------------- 4. MULTI-SCENE ISLAMIC BACKGROUND ----------------
              def download_video(url, path):
                  try:
                      r = session.get(url, timeout=40, stream=True)
                      if r.status_code == 200:
                          with open(path, 'wb') as f:
                              for chunk in r.iter_content(chunk_size=1024*1024):
                                  if chunk: f.write(chunk)
                          return True
                  except: pass
                  return False

              def get_multi_bg(dur):
                  DARKEN = "eq=contrast=1.10:brightness=0.02:saturation=1.12,vignette=PI/5"
                  islamic_queries = ["mosque night", "islamic architecture", "kaaba", "quran book", "ramadan lantern"]
                  valid_keywords = ["mosque", "islam", "muslim", "quran", "kaaba", "prayer", "ramadan", "islamic", "makkah", "madinah"]
                  
                  downloaded_vids = []
                  pk = os.environ.get("PEXELS_API_KEY")
                  
                  if pk:
                      for q in random.sample(islamic_queries, len(islamic_queries)):
                          if len(downloaded_vids) >= 3: break
                          try:
                              r = session.get(f"https://api.pexels.com/videos/search?query={q}&orientation=portrait&per_page=10", headers={"Authorization": pk}, timeout=15)
                              if r.status_code == 200:
                                  for v in r.json().get("videos", []):
                                      alt = v.get("alt", "").lower()
                                      if any(kw in alt for kw in valid_keywords) or any(kw in str(v).lower() for kw in valid_keywords):
                                          files = sorted(v.get("video_files", []), key=lambda x: x.get("width", 0), reverse=True)
                                          if files:
                                              path = f"vid_{len(downloaded_vids)}.mp4"
                                              if download_video(files[0]["link"], path):
                                                  # Process each video to match duration
                                                  processed = f"proc_{len(downloaded_vids)}.mp4"
                                                  seg_dur = dur / 3.0
                                                  run_cmd(f'ffmpeg -y -stream_loop -1 -i {path} -vf "scale=1200:2140:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z=\'min(zoom+0.0004,1.06)\':d=1:x=\'iw/2-(iw/zoom/2)\':y=\'ih/2-(ih/zoom/2)\':s=1080x1920,setsar=1,{DARKEN}" -t {seg_dur:.2f} -an -c:v libx264 -preset veryfast -crf 18 {processed}')
                                                  downloaded_vids.append(processed)
                                                  break
                          except: pass
                  
                  if len(downloaded_vids) < 2:
                      api_status["Background"]["Strict"] = "failed (Not enough videos)"
                      return None

                  # Crossfade Multiple Videos
                  out = "bg_final.mp4"
                  if len(downloaded_vids) == 2:
                      run_cmd(f'ffmpeg -y -i {downloaded_vids[0]} -i {downloaded_vids[1]} -filter_complex "[0:v][1:v]xfade=transition=fade:duration=1:offset={dur/2 - 0.5:.2f}[outv]" -map "[outv]" -t {dur:.2f} -c:v libx264 -preset veryfast -crf 18 {out}')
                  else:
                      run_cmd(f'ffmpeg -y -i {downloaded_vids[0]} -i {downloaded_vids[1]} -i {downloaded_vids[2]} -filter_complex "[0:v][1:v]xfade=transition=fade:duration=1:offset={dur/3 - 1:.2f}[v01]; [v01][2:v]xfade=transition=fade:duration=1:offset={2*(dur/3) - 2:.2f}[outv]" -map "[outv]" -t {dur:.2f} -c:v libx264 -preset veryfast -crf 18 {out}')
                  
                  api_status["Background"]["Multi-Scene"] = "success"
                  return out

              def make_logo():
                  # Logo Generation Logic
                  try:
                      canvas = Image.new("RGBA", (400, 170), (0,0,0,0))
                      draw = ImageDraw.Draw(canvas)
                      draw.rounded_rectangle([6,6,394,164], radius=16, fill=(16,12,6,245), outline=(212,175,55,255), width=5)
                      try: fnt = ImageFont.truetype(os.path.expanduser("~/.fonts/NotoSans-Bold.ttf"), 44)
                      except: fnt = ImageFont.load_default()
                      draw.text((200, 65), "SAWAJ", fill=(230,200,130,255), font=fnt, anchor="mm")
                      draw.text((200, 115), "STUDIO", fill=(200,170,110,255), font=fnt, anchor="mm")
                      canvas.save("avatar.png")
                      return True
                  except: return False

              def upload_drive(path):
                  try:
                      creds = Credentials(None, refresh_token=os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN"), client_id=os.environ.get("GOOGLE_DRIVE_CLIENT_ID"), client_secret=os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET"), token_uri="https://oauth2.googleapis.com/token")
                      service = build("drive", "v3", credentials=creds, cache_discovery=False)
                      meta = {"name": f"GlobalNo1_Story_{int(time.time())}.mp4"}
                      folder_id = os.environ.get("DRIVE_STORY_FOLDER_ID")
                      if folder_id: meta["parents"] = [folder_id]
                      up = service.files().create(body=meta, media_body=MediaFileUpload(path, mimetype="video/mp4", resumable=True), fields="id").execute()
                      did = up.get("id")
                      service.permissions().create(fileId=did, body={"type": "anyone", "role": "reader"}).execute()
                      link = f"https://drive.google.com/file/d/{did}/view"
                      api_status["Drive"]["Upload"] = "success"
                      send_tg(f"✅ <b>Drive Upload Successful</b>\n🔗 <a href='{link}'>Click Here to Watch</a>")
                  except Exception as e:
                      api_status["Drive"]["Upload"] = f"failed ({str(e)[:50]})"
                      send_tg(f"❌ Drive Upload Failed: {e}")

              # ==================== EXECUTION ====================
              h = fetch_hadith()
              if not h: raise Exception("Hadith APIs fail ho gayi hain.")
              hindi = translate_text(h['english'])
              if not hindi: raise Exception("Translation APIs fail ho gayi hain.")
              
              if not gen_tts(f"हदीस शरीफ। {hindi}", "s_raw.mp3"): raise Exception("TTS fail ho gayi.")
              gen_tts("अस्सलामु अलैकुम, स्वागत है आज की हदीस में।", "intro_voice.mp3")

              run_cmd('ffmpeg -y -i s_raw.mp3 -af "atempo=0.88,loudnorm=I=-16:TP=-1.5:LRA=11,volume=1.35" s_v.mp3')
              d1 = MP3("s_v.mp3").info.length
              voice_dur = d1 + 7.0

              # Background Video Fetch (Multi-Scene)
              bg_vid = get_multi_bg(voice_dur + 4.0)
              if not bg_vid: raise Exception("Strict Islamic Background Videos nahi mili.")

              # SFX Generation (Whoosh and Ding)
              run_cmd('ffmpeg -y -f lavfi -i "sine=frequency=1000:duration=0.3" -af "afade=t=in:st=0:d=0.05,afade=t=out:st=0.2:d=0.1" ding.mp3')
              run_cmd('ffmpeg -y -f lavfi -i "anoisesrc=color=pink:duration=1.0" -af "afade=t=in:st=0:d=0.2,afade=t=out:st=0.8:d=0.2" whoosh.mp3')

              # Audio Mixing
              # 1. Concat Intro + Hadith
              run_cmd('ffmpeg -y -i intro_voice.mp3 -i s_v.mp3 -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1[mainvoice]" -map "[mainvoice]" s_fullvoice.mp3')
              
              # 2. Add Ducking + SFX + Background Music (if available, else just voice)
              # We skip music API here to ensure strict fast build, but we can add dummy music volume 0
              run_cmd(f'ffmpeg -y -i s_fullvoice.mp3 -i whoosh.mp3 -i ding.mp3 -filter_complex "[0:a]volume=1.2[voice]; [1:a]adelay=3000|3000[wh]; [2:a]adelay=6000|6000[dg]; [voice][wh][dg]amix=inputs=3:duration=first:dropout_transition=2[aout]" -map "[aout]" -c:a libmp3lame -b:a 192k s_final_audio.mp3')

              make_logo()
              fonts_dir = os.path.expanduser("~/.fonts")
              date_str = datetime.datetime.now().strftime("%d %B %Y")

              # Advanced ASS Subtitles (Karaoke + Glow)
              ass = f"""[Script Info]
ScriptType: v4.00+
PlayResX: 1080
PlayResY: 1920
WrapStyle: 0
ScaledBorderAndShadow: yes

[V4+ Styles]
Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
Style: Hook,Noto Sans,95,&H0000FFFF,&H000000FF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,10,4,5,40,40,0,1
Style: Intro,Noto Sans,75,&H00FFFFFF,&H000000FF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,6,3,5,40,40,0,1
Style: Arabic,Noto Naskh Arabic,90,&H00F0E6D2,&H000000FF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,6,3,2,40,40,140,1
Style: Hindi,Noto Sans Devanagari,75,&H00FFFFFF,&H0000FFFF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,5,3,2,40,40,420,1
Style: English,Noto Sans,60,&H00D0D0D0,&H0000FFFF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,4,3,2,40,40,620,1
Style: Outro,Noto Sans,85,&H00F0E6D2,&H000000FF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,6,3,5,40,40,0,1

[Events]
Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text
Dialogue: 0,0:00:00.00,0:00:02.50,Hook,,0,0,0,,{{\\fad(500,500)\\pos(540,400)\\t(0,500,\\fscx110\\fscy110)}}क्या आप जानते हैं?
Dialogue: 0,0:00:02.50,0:00:05.00,Intro,,0,0,0,,{{\\fad(500,500)\\pos(540,960)}}आज की हदीस
Dialogue: 0,0:00:05.00,0:00:07.00,Intro,,0,0,0,,{{\\fad(500,500)\\pos(540,960)}}{date_str}
Dialogue: 0,0:00:06.00,0:00:08.00,Intro,,0,0,0,,{{\\fad(500,500)\\pos(540,1300)\\c&H00FF00&\\t(0,500,\\fscx120\\fscy120)}}Subscribe & Share
"""

              def ts(t): return f"0:{int(t//60):02d}:{t%60:05.2f}"
              def typed(text, style, start, end):
                  words = sanitize(text).split()
                  if not words: return ""
                  wd = (end - start) / max(len(words), 1)
                  out, t = "", start
                  for w in words:
                      out += f"Dialogue: 0,{ts(t)},{ts(t+wd)},{style},,0,0,0,,{{\\c&H00FFFF&}}{w}{{\\c&HFFFFFF&}}\n"
                      t += wd
                  return out

              with open("s_subs.ass", "a", encoding="utf-8") as f:
                  f.write(ass)
                  f.write(typed(h.get("arabic", ""), "Arabic", 7.0, 7.0 + d1 - 0.25))
                  f.write(typed(hindi, "Hindi", 7.0, 7.0 + d1 - 0.25))
                  f.write(typed(h["english"], "English", 7.0, 7.0 + d1 - 0.25))
                  
                  outro_start = 7.0 + d1
                  f.write(f"Dialogue: 0,{ts(outro_start)},{ts(outro_start+4)},{Outro},,0,0,0,,{{\\fad(500,500)\\pos(540,800)\\t(0,500,\\fscx110\\fscy110)}}JazakAllah Khair\n")
                  f.write(f"Dialogue: 0,{ts(outro_start)},{ts(outro_start+4)},{Outro},,0,0,0,,{{\\fad(500,500)\\pos(540,950)\\c&H00FFFF&}}Subscribe for Daily Hadith\n")

              final = "Final_Global_Story.mp4"
              total = 7.0 + d1 + 4.0

              # CINEMATIC FILTERS: Film Grain, Light Leaks, Vignette, Subtitles, Logo Overlay
              filters = "[0:v]scale=1200:2140:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0004,1.06)':d=1:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1080x1920,setsar=1,eq=contrast=1.10:brightness=0.02:saturation=1.12,vignette=PI/5,noise=alls=10:allf=t[bg]; "
              
              if os.path.exists("avatar.png"):
                  filters += "[bg][2:v]overlay=W-w-40:40[vout]; "
                  logo_input = "-i avatar.png"
              else:
                  filters += "[bg]null[vout]; "
                  logo_input = ""

              filters += "[vout]subtitles=s_subs.ass:fontsdir=~/.fonts,format=yuv420p[outv]"

              run_cmd(f'ffmpeg -y -i {bg_vid} -i s_final_audio.mp3 {logo_input} -filter_complex "{filters}" -map "[outv]" -map 1:a -c:v libx264 -preset veryfast -crf 17 -b:v 7M -c:a aac -b:a 192k -t {total:.2f} -movflags +faststart {final}')
              
              send_tg(f"✅ GLOBAL NO.1 DONE → {total:.1f}s | {os.path.getsize(final)/1024/1024:.1f} MB")

              upload_drive(final)

              for f in ["s_raw.mp3", "s_v.mp3", "s_fullvoice.mp3", "s_final_audio.mp3", "s_subs.ass", "intro_voice.mp3", "whoosh.mp3", "ding.mp3"]:
                  if os.path.exists(f): os.remove(f)
              for f in os.listdir("."):
                  if f.startswith("vid_") or f.startswith("proc_") or f == "bg_final.mp4":
                      try: os.remove(f)
                      except: pass

              send_tg("🎉 <b>ULTIMATE GLOBAL NO.1 STORY COMPLETED & UPLOADED</b>")

          except Exception as e:
              send_tg(f"❌ <b>WORKFLOW CANCEL / VIDEO STOPPED</b>\n\n<b>Reason:</b> {str(e)}")
              report_api_status()
              sys.exit(1)
