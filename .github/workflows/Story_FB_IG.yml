          # ========== MAIN ==========
          def main():
              log(f"=== START (Mode: {MODE}) ===")
              s = HS()
              ctx = {}

              def p1():
                  h=None; tar=mat=nas=""; vd=0.0
                  for att in range(7):
                      log(f"  try {att+1}/7")
                      h = H(s, 15, 46)
                      log(f"  H#{h['num']} ({len(h['en'].split())}w)")
                      tar,mat,nas = MEAN(s, h["en"])
                      if not tar or len(tar) < 10: tar = TR(s, h["en"]) or "Amal ka daromadar niyaton par hai."
                      if not mat: mat = "Niyat sabse pehle."
                      if not nas: nas = "Pure niyat se kaam karo."
                      tt = (f"Assalamu Alaikum. Aaj ki Hadith. {tar}. "
                            f"Is Hadith ka matlab hai: {mat}. Naseehah: {nas}. Allah Hafiz.")
                      if not TTS(s, tt, "s_raw.mp3", "hi"): continue
                      MASTER("s_raw.mp3", "s_v.mp3")
                      vd = MP3D("s_v.mp3")
                      log(f"  dur {vd:.1f}s")
                      if vd <= 50.0: break
                  if vd > 52.0: raise Exception("No suitable Hadith")
                  ctx.update(h=h,tar=tar,mat=mat,nas=nas,vd=vd)
                  INFO.update(h=h,tar=tar,mat=mat,nas=nas,vd=vd)
                  return True

              def p2():
                  quran = Q(s)
                  voice = "s_v.mp3"
                  if MUS(s, "music.mp3") and MIX("s_v.mp3","music.mp3","s_voice.mp3"):
                      voice = "s_voice.mp3"
                  try:
                      if MP3D(voice) > 58: voice = "s_v.mp3"
                  except Exception: pass
                  if not BG(s, "bg.mp4", ctx["vd"]+4.0):
                      log("BG fail — black fallback", "WARN")
                      runc(f'ffmpeg -nostdin -y -f lavfi -i "color=c=0x0a0a14:s=1080x1920:d={ctx["vd"]+7}" '
                           f'-c:v libx264 -preset veryfast -crf 23 bg.mp4', 150)
                  ctx.update(quran=quran, voice=voice)
                  INFO.update(quran=quran)
                  return True

              def p3():
                  for c in ["logo.png","assets/logo.png","logo.jpg","assets/logo.jpg"]:
                      if os.path.exists(c):
                          try:
                              im = Image.open(c).convert("RGBA")
                              if im.width > 300:
                                  im = im.resize((300, int(im.height*300/im.width)), Image.Resampling.LANCZOS)
                              b, bot = 7, 14
                              cv = Image.new("RGBA",(im.width+b*2, im.height+b+bot),(0,0,0,0))
                              dd = ImageDraw.Draw(cv)
                              dd.rectangle([0,0,cv.width-1,cv.height-1], outline=(212,175,55,255), width=b)
                              cv.paste(im,(b,b),im); cv.save("avatar.png"); break
                          except Exception: continue
                  ctx["logo"] = os.path.exists("avatar.png")
                  return True

              def p4():
                  os.makedirs("s_frames", exist_ok=True)
                  fps, intro, outro = 25, 2.6, 2.9
                  total = intro + ctx["vd"] + outro; n = int(total * fps)
                  log(f"  {n} frames")
                  h = ctx["h"]; logo = ctx["logo"]
                  for fi in range(n):
                      t = fi / fps
                      img = Image.new("RGBA",(1080,1920),(0,0,0,0))
                      d = ImageDraw.Draw(img)
                      if t < intro: DINTRO(img, d, t, intro)
                      elif t < intro+ctx["vd"]:
                          DMAIN(img, d, t-intro, ctx["vd"], ctx["tar"], h.get("ar",""),
                                h["en"], f"#{h['num']} - {h['coll']}", logo)
                      else: DOUTRO(img, d, t-(intro+ctx["vd"]), outro)
                      img.save(f"s_frames/frame_{fi:05d}.png")
                  ctx["total"]=total; ctx["n"]=n; INFO["n_frames"]=n
                  return True

              def p5():
                  os.makedirs("output/final", exist_ok=True)
                  out = "output/final/Final_Story.mp4"
                  runc(f'ffmpeg -nostdin -y -i bg.mp4 -framerate 25 -i s_frames/frame_%05d.png -i {ctx["voice"]} '
                       f'-filter_complex "[0:v][1:v]overlay=0:0:shortest=1,format=yuv420p[outv]" '
                       f'-map "[outv]" -map 2:a -c:v libx264 -preset veryfast -crf 20 '
                       f'-maxrate 8M -bufsize 16M -c:a aac -b:a 192k -t {round(ctx["total"],2)} '
                       f'-movflags +faststart {out}', 1700)
                  sz = os.path.getsize(out) / (1024*1024)
                  log(f"  {sz:.1f} MB")
                  if sz > 95: ER.append(f"Video {sz:.1f}MB may exceed IG limit")
                  mid = min(int(ctx["n"]*0.40), ctx["n"]-1)
                  Image.open(f"s_frames/frame_{mid:05d}.png").save("output/final/thumbnail.jpg", quality=92)
                  ctx["out"]=out; INFO["vsz"]=sz
                  return True

              def p6():
                  _, dd = DRIVE(ctx["out"]); ctx["dd"] = dd; return True

              def p7():
                  h = ctx["h"]
                  tags = ("#Hadith #SahihBukhari #SahihMuslim #IslamicVideo #Quran "
                          "#HindiHadith #IslamicQuotes #Sunnah #Dawah #Islam #SawajStudio "
                          "#HadithOfTheDay #IslamicReminder")
                  parts = [f"Hadith: {ctx['tar']}", f"Matlab: {ctx['mat']}",
                           f"Naseehah: {ctx['nas']}", h["en"]]
                  if ctx.get("quran"): parts.append(ctx["quran"])
                  parts.append(tags)
                  cap = "\n\n".join(parts)
                  if MODE == "offline_test":
                      S["FB"]="skip:offline"; S["IG"]="skip:offline"; log("  offline")
                  else:
                      FBUP(s, ctx["out"], cap)
                      if ctx.get("dd"): IGUP(s, ctx["dd"], cap)
                      else: S["IG"]="FAIL:no-drive-url"; ER.append("IG: no Drive URL")
                  return True

              phase("P1 Hadith+AI+TTS", p1)
              phase("P2 Music+Background", p2)
              phase("P3 Logo", p3)
              phase("P4 Frame Render", p4)
              phase("P5 Video Encode", p5)
              phase("P6 Drive Upload", p6)
              phase("P7 Social Upload", p7)
              log("=== ALL DONE ===")
              return 0

          if __name__ == "__main__":
              rc = 0
              try:
                  rc = main()
              except Exception as e:
                  print(f"[FATAL] {e}", flush=True)
                  print(traceback.format_exc()[:1500], flush=True)
                  ER.append(f"FATAL: {str(e)[:180]}"); rc = 1
              finally:
                  for f in ["s_raw.mp3","s_v.mp3","s_voice.mp3","music.mp3",
                            "bg.mp4","tmp_bg.mp4","avatar.png"]:
                      try:
                          if os.path.exists(f): os.remove(f)
                      except Exception: pass
                  shutil.rmtree("s_frames", ignore_errors=True)
                  try: REPORT("output/final/thumbnail.jpg")
                  except Exception: pass
              sys.exit(rc)
          PYEOF
          python3 bot.py

      - name: Artifact Backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-${{ github.run_number }}
          path: _work/output/final/
          retention-days: 3
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: rm -rf _work
