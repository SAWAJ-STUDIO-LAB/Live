                  _tg_msg(tok, cid, s5)
              else:
                  _tg_msg(tok, cid, "✅ ALL SYSTEMS OK!\n━━━━━━━━━━━━━━━━━━━━━━\nKoi error nahi!")

              lines = ["SAWAJ STUDIO - FULL REPORT",
                       f"Time: {datetime.now():%Y-%m-%d %H:%M:%S}", f"Mode: {MODE}",
                       "="*50, "STATUS:"]
              for k in ["AI","TTS","Music","BG","Drive","FB","IG"]:
                  lines.append(f"  {k}: {S[k]}")
              lines += ["", f"PHASES ({len(PHASES)}):"]
              for p in PHASES: lines.append(f"  - {p}")
              lines += ["", f"ERRORS: {len(ER)} total / {len(ue)} unique", "-"*50]
              for e in ue: lines.append(f"  - {e}")
              lines += ["", "RAW ERRORS:"]
              for e in ER: lines.append(f"  - {e}")
              lines += ["", "HADITH:", f"  Coll: {h_c} #{h_n}",
                        f"  Tarjuma: {tar}", f"  Matlab: {mat}",
                        f"  Naseehah: {nas}", f"  English: {h_en}",
                        f"  Quran: {quran}"]
              content = "\n".join(lines)
              try:
                  os.makedirs("output/final", exist_ok=True)
                  with open("output/final/report.txt","w",encoding="utf-8") as f: f.write(content)
              except Exception: pass
              _tg_doc(tok, cid, "report.txt", content)

          # ========== MAIN (phase-based, nothing blocks) ==========
          def main():
              log(f"=== START (Mode: {MODE}) ===")
              s = HS()
              ctx = {}

              def p1():
                  """Hadith + AI + TTS - ALWAYS succeeds"""
                  h = None; tar = mat = nas = ""; vd = 0.0
                  best_h = None; best_tar = best_mat = best_nas = ""; best_vd = 999.0
                  for att in range(5):
                      log(f"  try {att+1}/5")
                      h = H(s, 8, 30)
                      log(f"  H#{h['num']} ({len(h['en'].split())}w)")
                      # Try AI translation
                      tar, mat, nas = MEAN(s, h["en"])
                      # Fallback to hardcoded (if in dict)
                      if not tar or len(tar) < 8:
                          if h.get("hi"): tar = h["hi"]
                          else: tar = TR(s, h["en"]) or "Amal ka daromadar niyat par hai."
                      if not mat or len(mat) < 3:
                          mat = h.get("mat") or "Niyat sabse zaroori hai."
                      if not nas or len(nas) < 3:
                          nas = h.get("nas") or "Pure niyat se kaam karein."
                      tt = (f"Assalamu Alaikum. Aaj ki Hadith. {tar}. "
                            f"Matlab: {mat}. Naseehah: {nas}. Allah Hafiz.")
                      if not TTS(s, tt, "s_raw.mp3", "hi"):
                          log("  TTS fail"); continue
                      MASTER("s_raw.mp3", "s_v.mp3")
                      cur_vd = MP3D("s_v.mp3")
                      log(f"  dur {cur_vd:.1f}s")
                      if cur_vd < best_vd:
                          best_vd = cur_vd; best_h = h; best_tar = tar
                          best_mat = mat; best_nas = nas
                      if cur_vd <= 48.0: vd = cur_vd; break
                  if not best_h:
                      # Ultimate fallback
                      best_h = dict(coll="Sahih al-Bukhari", num="1",
                                    en="Actions are judged by intentions.",
                                    ar="إنما الأعمال بالنيات")
                      best_tar = "Amal ka daromadar niyat par hai."
                      best_mat = "Niyat sabse zaroori."
                      best_nas = "Pure niyat se kaam karein."
                      tt = f"Assalamu Alaikum. Aaj ki Hadith. {best_tar}. Allah Hafiz."
                      TTS(s, tt, "s_raw.mp3", "hi")
                      MASTER("s_raw.mp3", "s_v.mp3")
                      best_vd = MP3D("s_v.mp3")
                  if best_vd <= 0:
                      # Silent audio final fallback
                      runc_soft(f'ffmpeg -nostdin -y -f lavfi -i anullsrc=r=24000:cl=mono '
                                f'-t 20 -q:a 9 -c:a libmp3lame s_v.mp3', 30)
                      best_vd = 20.0
                  if best_vd > 55.0:
                      # Force trim to 55s
                      runc_soft(f'ffmpeg -nostdin -y -i s_v.mp3 -t 55 -c copy s_v_trim.mp3', 60)
                      if os.path.exists("s_v_trim.mp3"):
                          shutil.move("s_v_trim.mp3", "s_v.mp3")
                          best_vd = 55.0
                  ctx.update(h=best_h, tar=best_tar, mat=best_mat, nas=best_nas, vd=best_vd)
                  INFO.update(h=best_h, tar=best_tar, mat=best_mat, nas=best_nas, vd=best_vd)
                  log(f"  FINAL dur {best_vd:.1f}s")
                  return True

              def p2():
                  vd = ctx.get("vd", 20.0)
                  quran = Q(s)
                  voice = "s_v.mp3"
                  if MUS(s, "music.mp3") and MIX("s_v.mp3","music.mp3","s_voice.mp3"):
                      voice = "s_voice.mp3"
                  try:
                      if MP3D(voice) > 55: voice = "s_v.mp3"
                  except Exception: pass
                  BG(s, "bg.mp4", vd+4.0)  # always succeeds now
                  ctx.update(quran=quran, voice=voice)
                  INFO.update(quran=quran)
                  return True

              def p3():
                  for c in ["logo.png","assets/logo.png","logo.jpg","assets/logo.jpg"]:
                      if os.path.exists(c):
                          try:
                              im = Image.open(c).convert("RGBA")
                              if im.width > 300:
                                  im = im.resize((300, int(im.height*300/im.width)), Image.Resampling.LANCZOS)
                              b, bot = 7, 14
                              cv = Image.new("RGBA",(im.width+b*2, im.height+b+bot),(0,0,0,0))
                              dd = ImageDraw.Draw(cv)
                              dd.rectangle([0,0,cv.width-1,cv.height-1], outline=(212,175,55,255), width=b)
                              cv.paste(im,(b,b),im); cv.save("avatar.png"); break
                          except Exception: continue
                  ctx["logo"] = os.path.exists("avatar.png")
                  return True

              def p4():
                  vd = ctx.get("vd", 20.0)
                  h = ctx.get("h") or dict(coll="—",num="—",en="",ar="")
                  os.makedirs("s_frames", exist_ok=True)
                  fps, intro, outro = 25, 2.6, 2.9
                  total = intro + vd + outro; n = int(total * fps)
                  log(f"  {n} frames")
                  logo = ctx.get("logo", False)
                  for fi in range(n):
                      try:
                          t = fi / fps
                          img = Image.new("RGBA",(1080,1920),(0,0,0,0))
                          d = ImageDraw.Draw(img)
                          if t < intro: DINTRO(img, d, t, intro)
                          elif t < intro+vd:
                              DMAIN(img, d, t-intro, vd, ctx.get("tar",""), h.get("ar",""),
                                    h.get("en",""), f"#{h.get('num','')} - {h.get('coll','')}", logo)
                          else: DOUTRO(img, d, t-(intro+vd), outro)
                          img.save(f"s_frames/frame_{fi:05d}.png")
                      except Exception as e:
                          # Save blank frame to keep sequence continuous
                          img = Image.new("RGBA",(1080,1920),(0,0,0,255))
                          img.save(f"s_frames/frame_{fi:05d}.png")
                          log(f"  frame {fi} fallback: {str(e)[:50]}", "WARN")
                  ctx["total"]=total; ctx["n"]=n; INFO["n_frames"]=n
                  return True

              def p5():
                  voice = ctx.get("voice") or "s_v.mp3"
                  total = ctx.get("total", 30)
                  n = ctx.get("n", 750)
                  os.makedirs("output/final", exist_ok=True)
                  out = "output/final/Final_Story.mp4"
                  # Try high quality first
                  ok = runc_soft(f'ffmpeg -nostdin -y -i bg.mp4 -framerate 25 -i s_frames/frame_%05d.png -i {voice} '
                       f'-filter_complex "[0:v][1:v]overlay=0:0:shortest=1,format=yuv420p[outv]" '
                       f'-map "[outv]" -map 2:a -c:v libx264 -preset veryfast -crf 20 '
                       f'-maxrate 8M -bufsize 16M -c:a aac -b:a 192k -t {round(total,2)} '
                       f'-movflags +faststart {out}', 1700)
                  if not ok or not os.path.exists(out):
                      log("  Trying encode fallback...", "WARN")
                      ok = runc_soft(f'ffmpeg -nostdin -y -i bg.mp4 -framerate 25 -i s_frames/frame_%05d.png '
                           f'-c:v libx264 -preset ultrafast -crf 25 -pix_fmt yuv420p '
                           f'-t {round(total,2)} -movflags +faststart {out}', 900)
                  if not ok or not os.path.exists(out):
                      raise Exception("Encode failed completely")
                  sz = os.path.getsize(out) / (1024*1024)
                  log(f"  {sz:.1f} MB")
                  if sz > 95: ER.append(f"Video {sz:.1f}MB may exceed IG limit")
                  mid = min(int(n*0.40), n-1)
                  Image.open(f"s_frames/frame_{mid:05d}.png").save("output/final/thumbnail.jpg", quality=92)
                  ctx["out"]=out; INFO["vsz"]=sz
                  return True

              def p6():
                  out = ctx.get("out")
                  if not out: raise Exception("No video")
                  url, source = get_public_url(out)
                  ctx["pub_url"] = url
                  ctx["pub_source"] = source
                  return True

              def p7():
                  h = ctx.get("h") or {}
                  out = ctx.get("out")
                  if not out: raise Exception("No video")
                  tags = ("#Hadith #SahihBukhari #SahihMuslim #IslamicVideo #Quran "
                          "#HindiHadith #IslamicQuotes #Sunnah #Dawah #Islam #SawajStudio "
                          "#HadithOfTheDay #IslamicReminder")
                  parts = [f"Hadith: {ctx.get('tar','')}", f"Matlab: {ctx.get('mat','')}",
                           f"Naseehah: {ctx.get('nas','')}", h.get("en","")]
                  if ctx.get("quran"): parts.append(ctx["quran"])
                  parts.append(tags)
                  cap = "\n\n".join(parts)
                  if MODE == "offline_test":
                      S["FB"]="skip:offline"; S["IG"]="skip:offline"
                  else:
                      FBUP(s, out, cap)
                      if ctx.get("pub_url"): IGUP(s, ctx["pub_url"], cap)
                      else: S["IG"]="FAIL:no-url"; ER.append("IG: no public URL")
                  return True

              # Run all phases - nothing blocks
              try: p1()
              except Exception as e: ER.append(f"P1 fatal: {str(e)[:80]}"); log(f"P1 fatal: {e}", "ERROR")
              try: p2()
              except Exception as e: ER.append(f"P2 fatal: {str(e)[:80]}")
              try: p3()
              except Exception as e: ER.append(f"P3 fatal: {str(e)[:80]}")
              try: p4()
              except Exception as e: ER.append(f"P4 fatal: {str(e)[:80]}"); log(f"P4 fatal: {e}", "ERROR")
              try: p5()
              except Exception as e: ER.append(f"P5 fatal: {str(e)[:80]}"); log(f"P5 fatal: {e}", "ERROR")
              try: p6()
              except Exception as e: ER.append(f"P6 fatal: {str(e)[:80]}")
              try: p7()
              except Exception as e: ER.append(f"P7 fatal: {str(e)[:80]}")

              log("=== ALL DONE ===")
              return 0

          if __name__ == "__main__":
              rc = 0
              try:
                  rc = main()
              except Exception as e:
                  print(f"[FATAL] {e}", flush=True)
                  print(traceback.format_exc()[:1500], flush=True)
                  ER.append(f"FATAL: {str(e)[:180]}"); rc = 1
              finally:
                  for f in ["s_raw.mp3","s_v.mp3","s_voice.mp3","music.mp3",
                            "bg.mp4","tmp_bg.mp4","avatar.png"]:
                      try:
                          if os.path.exists(f): os.remove(f)
                      except Exception: pass
                  shutil.rmtree("s_frames", ignore_errors=True)
                  try: REPORT("output/final/thumbnail.jpg")
                  except Exception: pass
              sys.exit(rc)
          PYEOF
          python3 bot.py

      - name: Artifact Backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-${{ github.run_number }}
          path: _work/output/final/
          retention-days: 3
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: rm -rf _work
