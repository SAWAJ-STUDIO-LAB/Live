name: Sawaj Studio Bot Story FB IG

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        default: 'online'
        type: choice
        options: [online, offline_test]

permissions:
  contents: read

concurrency:
  group: sawaj-story
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Deps
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fonts-noto-color-emoji fonts-noto-cjk
          pip install --quiet --upgrade pip
          pip install --quiet requests urllib3 Pillow mutagen edge-tts arabic-reshaper python-bidi google-auth google-auth-oauthlib google-api-python-client
      - name: Run Pipeline
        env:
          UPLOAD_MODE: ${{ github.event.inputs.mode || 'online' }}
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
          QURAN_API_URL: ${{ secrets.QURAN_API_URL }}
          OPENROUTER_API_KEY_AI: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY_AI: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY_AI: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY_AI: ${{ secrets.MISTRAL_API_KEY_AI }}
          COHERE_API_KEY_AI: ${{ secrets.COHERE_API_KEY_AI }}
          HUGGINGFACE_API_KEY_AI: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
          CEREBRAS_API_KEY_AI: ${{ secrets.CEREBRAS_API_KEY_AI }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          POLLINATIONS_API_URL: ${{ secrets.POLLINATIONS_API_URL }}
          LIBRETRANSLATE_URL: ${{ secrets.LIBRETRANSLATE_URL }}
          DEEPLX_URL: ${{ secrets.DEEPLX_URL }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICECAFE_API_URL: ${{ secrets.VOICECAFE_API_URL }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          FREESOUND_MUSIC_URL: ${{ secrets.FREESOUND_MUSIC_URL || secrets.FREETOUSE_MUSIC_URL }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GDRIVE_STORY_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: |
          set -e
          mkdir -p _work && cd _work
          cat > bot.py << 'PYEOF'
          import os, sys, time, subprocess, shutil, random, base64, traceback
          from datetime import datetime
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          from PIL import Image, ImageDraw, ImageFont
          from mutagen.mp3 import MP3
          try:
              import arabic_reshaper
              from bidi.algorithm import get_display
              AR = True
          except Exception:
              AR = False

          def E(k): return os.environ.get(k, "").strip()
          MODE = E("UPLOAD_MODE") or "online"
          S = dict(AI="—", TTS="—", Music="—", BG="—", Drive="—", FB="skip", IG="skip")
          ER = []; PHASES = []; INFO = {}

          def log(m, lv="INFO"):
              print(f"[{datetime.now():%H:%M:%S}][{lv}] {m}", flush=True)

          def phase(name, fn):
              log(f"========== {name} ==========")
              PHASES.append(name)
              try:
                  r = fn(); log(f"---- {name} OK ----"); return r
              except Exception as e:
                  msg = f"{name}: {str(e)[:150]}"
                  log(f"!!!! {name} FAILED: {msg}", "ERROR")
                  ER.append(msg); return None

          def runc(cmd, t=1800):
              log("CMD " + cmd[:110])
              r = subprocess.run(cmd, shell=True, stdin=subprocess.DEVNULL,
                                 stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=t)
              if r.returncode:
                  e = r.stderr.decode("utf-8","ignore").strip()[-350:]
                  raise RuntimeError(f"cmd: {e[:220]}")

          def HS():
              s = requests.Session()
              s.mount("https://", HTTPAdapter(max_retries=Retry(total=4, backoff_factor=1.4,
                        status_forcelist=[429,500,502,503,504])))
              s.headers.update({"User-Agent":"Sawaj/7"})
              return s

          def DL(s, url, path, mn=10000):
              for _ in range(3):
                  try:
                      r = s.get(url, timeout=80, stream=True)
                      if r.status_code != 200: continue
                      w = 0
                      with open(path,"wb") as f:
                          for ch in r.iter_content(65536):
                              if not ch: continue
                              w += len(ch)
                              if w > 250*1024*1024: return False
                              f.write(ch)
                      if w > mn: return True
                  except Exception: pass
              return False

          # ========== AI ==========
          def _oai(s, url, key, model, p, mt):
              r = s.post(url, headers={"Authorization":f"Bearer {key}",
                                       "Content-Type":"application/json"},
                         json={"model":model,"messages":[{"role":"user","content":p}],
                               "temperature":0.5,"max_tokens":mt}, timeout=55)
              if r.status_code == 200:
                  return r.json()["choices"][0]["message"]["content"].strip()
              raise Exception(f"HTTP {r.status_code}")

          def _multi(s, url, key, models, p, mt):
              last = "no model"
              for m in models:
                  try: return _oai(s, url, key, m, p, mt)
                  except Exception as e: last = f"{m}: {str(e)[:30]}"
              raise Exception(last)

          def _gem(s, key, p, mt):
              for m in ["gemini-2.0-flash","gemini-2.0-flash-exp",
                        "gemini-1.5-flash-latest","gemini-1.5-flash"]:
                  try:
                      u = f"https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent?key={key}"
                      r = s.post(u, json={"contents":[{"parts":[{"text":p}]}]}, timeout=55)
                      if r.status_code == 200:
                          return r.json()["candidates"][0]["content"]["parts"][0]["text"].strip()
                  except Exception: pass
              raise Exception("Gemini failed")

          def _coh(s, key, p, mt):
              for u, m in [("https://api.cohere.com/v2/chat","command-r-plus-08-2024"),
                           ("https://api.cohere.com/v1/chat","command-r-plus")]:
                  try:
                      r = s.post(u, headers={"Authorization":f"Bearer {key}",
                                             "Content-Type":"application/json"},
                                 json={"model":m,"messages":[{"role":"user","content":p}]}, timeout=55)
                      if r.status_code == 200:
                          d = r.json()
                          if "message" in d and "content" in d["message"]:
                              c = d["message"]["content"]
                              if isinstance(c, list) and c: return c[0].get("text","").strip()
                              if isinstance(c, str): return c.strip()
                          if "text" in d: return d["text"].strip()
                  except Exception: pass
              raise Exception("Cohere failed")

          def _hf(s, key, p, mt):
              r = s.post("https://api-inference.huggingface.co/models/meta-llama/Meta-Llama-3-8B-Instruct",
                         headers={"Authorization":f"Bearer {key}"},
                         json={"inputs":p,"parameters":{"max_new_tokens":mt,"temperature":0.5,
                               "return_full_text":False}}, timeout=85)
              if r.status_code == 200:
                  d = r.json()
                  if isinstance(d, list) and d: return d[0].get("generated_text","").strip()
                  if isinstance(d, dict): return d.get("generated_text","").strip()
              raise Exception(f"HTTP {r.status_code}")

          def _pol(s, base, p, mt):
              base = base.rstrip("/")
              q = requests.utils.quote(p)
              for method, u in [("POST", f"{base}/openai"), ("GET", f"{base}/openai?prompt={q}")]:
                  try:
                      if method == "GET": r = s.get(u, timeout=55)
                      else: r = s.post(u, headers={"Content-Type":"application/json"},
                                       json={"model":"openai","messages":[{"role":"user","content":p}]},
                                       timeout=55)
                      if r.status_code == 200:
                          try:
                              d = r.json()
                              if "choices" in d: return d["choices"][0]["message"]["content"].strip()
                          except Exception: pass
                          t = r.text.strip()
                          if t and len(t) > 30: return t[:2000]
                  except Exception: pass
              raise Exception("Pollinations failed")

          def AI(s, p, mt=560):
              cfgs = []
              if E("GROQ_API_KEY_AI"):
                  cfgs.append(("Groq", lambda: _multi(s, "https://api.groq.com/openai/v1/chat/completions",
                      E("GROQ_API_KEY_AI"), ["llama-3.3-70b-versatile","llama-3.1-70b-versatile",
                      "llama3-70b-8192","mixtral-8x7b-32768"], p, mt)))
              if E("CEREBRAS_API_KEY_AI"):
                  cfgs.append(("Cerebras", lambda: _multi(s, "https://api.cerebras.ai/v1/chat/completions",
                      E("CEREBRAS_API_KEY_AI"), ["llama3.1-70b","llama-3.3-70b"], p, mt)))
              if E("MISTRAL_API_KEY_AI"):
                  cfgs.append(("Mistral", lambda: _multi(s, "https://api.mistral.ai/v1/chat/completions",
                      E("MISTRAL_API_KEY_AI"), ["mistral-small-latest","open-mistral-7b",
                      "open-mixtral-8x7b"], p, mt)))
              if E("NVIDIA_API_KEY"):
                  cfgs.append(("NVIDIA", lambda: _multi(s, "https://integrate.api.nvidia.com/v1/chat/completions",
                      E("NVIDIA_API_KEY"), ["meta/llama-3.3-70b-instruct",
                      "meta/llama-3.1-70b-instruct"], p, mt)))
              if E("GEMINI_API_KEY_AI"):
                  cfgs.append(("Gemini", lambda: _gem(s, E("GEMINI_API_KEY_AI"), p, mt)))
              if E("OPENROUTER_API_KEY_AI"):
                  cfgs.append(("OpenRouter", lambda: _multi(s, "https://openrouter.ai/api/v1/chat/completions",
                      E("OPENROUTER_API_KEY_AI"), ["meta-llama/llama-3.3-70b-instruct:free",
                      "google/gemini-flash-1.5","openai/gpt-4o-mini"], p, mt)))
              if E("DEEPSEEK_API_KEY"):
                  cfgs.append(("DeepSeek", lambda: _multi(s, "https://api.deepseek.com/chat/completions",
                      E("DEEPSEEK_API_KEY"), ["deepseek-chat"], p, mt)))
              if E("COHERE_API_KEY_AI"):
                  cfgs.append(("Cohere", lambda: _coh(s, E("COHERE_API_KEY_AI"), p, mt)))
              if E("HUGGINGFACE_API_KEY_AI"):
                  cfgs.append(("HF", lambda: _hf(s, E("HUGGINGFACE_API_KEY_AI"), p, mt)))
              if E("POLLINATIONS_API_URL"):
                  cfgs.append(("Pollinations", lambda: _pol(s, E("POLLINATIONS_API_URL"), p, mt)))

              seen = set()
              for name, fn in cfgs:
                  try:
                      o = fn()
                      if o and len(o) > 20:
                          S["AI"] = f"ok:{name}"; log(f"AI {name} ok"); return o
                  except Exception as e:
                      log(f"AI {name} fail: {str(e)[:60]}", "WARN")
                      if name not in seen: ER.append(f"AI {name}: {str(e)[:50]}"); seen.add(name)
              S["AI"] = "FAIL"; return ""

          # ========== HADITH ==========
          BOOKS = [("eng-bukhari","ara-bukhari","Sahih al-Bukhari",7000),
                   ("eng-muslim","ara-muslim","Sahih Muslim",7000)]

          def H(s, mn=15, mx=46):
              bases = [E("HADITH_API_URL").rstrip("/")] if E("HADITH_API_URL") else []
              bases.append("https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1")
              for _ in range(40):
                  e,a,n,m = random.choice(BOOKS)
                  num = random.randint(1,m)
                  for b in bases:
                      try:
                          r = s.get(f"{b}/editions/{e}/{num}.json", timeout=12)
                          if r.status_code != 200: continue
                          hh = r.json().get("hadiths", [])
                          if not hh: continue
                          t = hh[0].get("text","").strip()
                          if len(t) < 20: continue
                          if not (mn <= len(t.split()) <= mx): continue
                          ar = ""
                          try:
                              r2 = s.get(f"{b}/editions/{a}/{num}.json", timeout=10)
                              if r2.status_code == 200:
                                  a2 = r2.json().get("hadiths", [])
                                  if a2: ar = a2[0].get("text","").strip()
                          except Exception: pass
                          return dict(coll=n, num=str(hh[0].get("hadithnumber") or num), en=t, ar=ar)
                      except Exception: continue
              return dict(coll="Sahih al-Bukhari", num="1",
                          en="The reward of deeds depends upon the intentions.",
                          ar="إنما الأعمال بالنيات")

          def Q(s):
              u = E("QURAN_API_URL")
              if not u: return ""
              try:
                  n = random.randint(1, 114)
                  r = s.get(f"{u.rstrip('/')}/v1/surah/{n}", timeout=12)
                  if r.status_code == 200:
                      a = r.json().get("data",{}).get("ayahs", [])
                      if a: return a[0].get("text","")
              except Exception: pass
              return ""

          def MEAN(s, en):
              p = ("You are a senior Islamic scholar. Translate the following authentic Hadith "
                   "into pure, beautiful, short Hindi. Then give a very brief Matlab and a "
                   "powerful short Naseehah in Hindi. Keep total under 40 seconds speaking time.\n\n"
                   f"Hadith: {en}\n\nReply EXACTLY:\nTarjuma: [Hindi]\nMatlab: [Hindi]\nNaseehah: [Hindi]")
              r = AI(s, p, 580)
              t = m = n = ""
              if all(x in r for x in ["Tarjuma:","Matlab:","Naseehah:"]):
                  a = r.split("Matlab:")
                  t = a[0].replace("Tarjuma:","").strip()
                  b = a[1].split("Naseehah:")
                  m = b[0].strip(); n = b[1].strip()
              else:
                  t = r.replace("Tarjuma:","").replace("Matlab:","").replace("Naseehah:","").strip()
              return t, m, n

          def TR(s, txt):
              if E("LIBRETRANSLATE_URL"):
                  try:
                      r = s.post(f"{E('LIBRETRANSLATE_URL').rstrip('/')}/translate",
                                 json={"q":txt,"source":"en","target":"hi","format":"text"}, timeout=25)
                      if r.status_code == 200:
                          t = r.json().get("translatedText","")
                          if t: return t
                  except Exception: pass
              if E("DEEPLX_URL"):
                  try:
                      r = s.post(f"{E('DEEPLX_URL').rstrip('/')}/translate",
                                 json={"text":txt,"source_lang":"EN","target_lang":"HI"}, timeout=25)
                      if r.status_code == 200:
                          t = r.json().get("data","")
                          if t: return t
                  except Exception: pass
              try:
                  r = s.get("https://api.mymemory.translated.net/get",
                            params={"q":txt[:500],"langpair":"en|hi"}, timeout=18)
                  if r.status_code == 200:
                      t = r.json().get("responseData",{}).get("translatedText","")
                      if t and "MYMEMORY" not in t.upper(): return t
              except Exception: pass
              return ""

          # ========== TTS ==========
          def TTS(s, txt, out, lang="hi"):
              if E("SARVAM_API_KEY"):
                  try:
                      r = s.post("https://api.sarvam.ai/text-to-speech",
                                 headers={"api-subscription-key":E("SARVAM_API_KEY"),
                                          "Content-Type":"application/json"},
                                 json={"inputs":[txt[:450]],"target_language_code":f"{lang}-IN",
                                       "speaker":"meera","pitch":0,"pace":0.86,"loudness":1.3,
                                       "speech_sample_rate":22050,"enable_preprocessing":True,
                                       "model":"bulbul:v1"}, timeout=130)
                      if r.status_code == 200:
                          a = r.json().get("audios",[])
                          if a:
                              with open(out,"wb") as f: f.write(base64.b64decode(a[0]))
                              S["TTS"] = "ok:Sarvam"; return True
                  except Exception: pass
              if E("ELEVENLABS_API_KEY"):
                  try:
                      r = s.post("https://api.elevenlabs.io/v1/text-to-speech/pNInz6obpgDQGcFmaJgB",
                                 headers={"Accept":"audio/mpeg","Content-Type":"application/json",
                                          "xi-api-key":E("ELEVENLABS_API_KEY")},
                                 json={"text":txt,"model_id":"eleven_multilingual_v2",
                                       "voice_settings":{"stability":0.4,"similarity_boost":0.8}},
                                 timeout=190)
                      if r.status_code == 200 and len(r.content) > 5000:
                          with open(out,"wb") as f: f.write(r.content)
                          S["TTS"] = "ok:ElevenLabs"; return True
                  except Exception: pass
              try:
                  v = {"hi":"hi-IN-MadhurNeural","ar":"ar-SA-HamedNeural","en":"en-US-ChristopherNeural"}.get(lang,"hi-IN-MadhurNeural")
                  tx = out + ".txt"
                  with open(tx,"w",encoding="utf-8") as f: f.write(txt)
                  subprocess.run(f'edge-tts --file "{tx}" --write-media "{out}" --voice {v} '
                                 f'--rate=-8% --pitch=-2Hz --volume=+12%',
                                 shell=True, check=True, stdin=subprocess.DEVNULL,
                                 stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=290)
                  os.remove(tx)
                  if os.path.exists(out) and os.path.getsize(out) > 1200:
                      S["TTS"] = "ok:Edge"; return True
              except Exception: pass
              if E("VOICECAFE_API_URL"):
                  try:
                      r = s.post(f"{E('VOICECAFE_API_URL').rstrip('/')}/api/tts",
                                 json={"text":txt[:900],"language":lang,"voice":"default","format":"mp3"},
                                 timeout=120)
                      if r.status_code == 200 and len(r.content) > 5000:
                          with open(out,"wb") as f: f.write(r.content)
                          S["TTS"] = "ok:VoiceCafe"; return True
                  except Exception: pass
              if E("DEEPGRAM_API_KEY"):
                  try:
                      r = s.post("https://api.deepgram.com/v1/speak?model=aura-asteria-en",
                                 headers={"Authorization":f"Token {E('DEEPGRAM_API_KEY')}",
                                          "Content-Type":"application/json"},
                                 json={"text":txt[:1800]}, timeout=120)
                      if r.status_code == 200 and len(r.content) > 5000:
                          with open(out,"wb") as f: f.write(r.content)
                          S["TTS"] = "ok:Deepgram"; return True
                  except Exception: pass
              S["TTS"] = "FAIL"; return False

          # ========== MUSIC ==========
          def MUS(s, out):
              try:
                  if E("FREESOUND_API_KEY"):
                      for q in ["ambient islamic","soft ambient","peaceful ambient","calm ambient"]:
                          try:
                              r = s.get("https://freesound.org/apiv2/search/text/",
                                        params={"query":q,"token":E("FREESOUND_API_KEY"),
                                                "fields":"id,previews",
                                                "filter":"duration:[18 TO 300]","page_size":6}, timeout=20)
                              if r.status_code == 200:
                                  for it in r.json().get("results",[]):
                                      u = it.get("previews",{}).get("preview-hq-mp3")
                                      if u and DL(s, u, out, 12000):
                                          S["Music"] = "ok:Freesound"; return True
                          except Exception: pass
                  if E("FREESOUND_MUSIC_URL") and DL(s, E("FREESOUND_MUSIC_URL"), out, 12000):
                      S["Music"] = "ok:FSU"; return True
                  if E("JAMENDO_CLIENT_ID"):
                      try:
                          r = s.get("https://api.jamendo.com/v3.0/tracks/",
                                    params={"client_id":E("JAMENDO_CLIENT_ID"),"format":"json",
                                            "limit":6,"tags":"ambient"}, timeout=20)
                          if r.status_code == 200:
                              for t in r.json().get("results",[]):
                                  u = t.get("audio")
                                  if u and DL(s, u, out, 12000):
                                      S["Music"] = "ok:Jamendo"; return True
                      except Exception: pass
                  if E("PIXABAY_API_KEY"):
                      try:
                          r = s.get("https://pixabay.com/api/",
                                    params={"key":E("PIXABAY_API_KEY"),"q":"ambient",
                                            "category":"music","per_page":6}, timeout=20)
                          if r.status_code == 200:
                              for h in r.json().get("hits",[]):
                                  u = h.get("audio")
                                  if u and DL(s, u, out, 12000):
                                      S["Music"] = "ok:Pixabay"; return True
                      except Exception: pass
                  S["Music"] = "FAIL"; return False
              except Exception as e:
                  S["Music"] = f"crash:{str(e)[:40]}"; return False

          # ========== BG ==========
          def BG(s, out, dur=62):
              try:
                  qs = ["mosque night","night sky stars","islamic architecture night",
                        "prayer silhouette","beautiful mosque exterior night",
                        "crescent moon night","soft lantern light"]
                  random.shuffle(qs)
                  for q in qs:
                      if E("PEXELS_API_KEY"):
                          try:
                              r = s.get("https://api.pexels.com/videos/search",
                                        headers={"Authorization":E("PEXELS_API_KEY")},
                                        params={"query":q,"orientation":"portrait","per_page":12}, timeout=16)
                              if r.status_code == 200:
                                  for v in r.json().get("videos",[])[:6]:
                                      ff = v.get("video_files",[])
                                      if not ff: continue
                                      pick = sorted(ff, key=lambda x: abs(x.get("width",0)-1080))[0]
                                      if pick.get("width",0) < 640: continue
                                      if DL(s, pick["link"], "tmp_bg.mp4"):
                                          runc(f'ffmpeg -nostdin -y -stream_loop -1 -i tmp_bg.mp4 -t {dur+2} '
                                               f'-vf "scale=1080:1920:force_original_aspect_ratio=increase,'
                                               f'crop=1080:1920,setsar=1,eq=brightness=0.03:saturation=1.06" '
                                               f'-an -c:v libx264 -preset veryfast -crf 22 {out}', 280)
                                          S["BG"] = "ok:Pexels"; return True
                          except Exception: pass
                      if E("PIXABAY_API_KEY"):
                          try:
                              r = s.get("https://pixabay.com/api/videos/",
                                        params={"key":E("PIXABAY_API_KEY"),"q":q,
                                                "orientation":"vertical","per_page":10}, timeout=16)
                              if r.status_code == 200:
                                  for h in r.json().get("hits",[])[:5]:
                                      for sk in ["medium","large","small"]:
                                          u = h.get("videos",{}).get(sk,{}).get("url")
                                          if u and DL(s, u, "tmp_bg.mp4"):
                                              runc(f'ffmpeg -nostdin -y -stream_loop -1 -i tmp_bg.mp4 -t {dur+2} '
                                                   f'-vf "scale=1080:1920:force_original_aspect_ratio=increase,'
                                                   f'crop=1080:1920,setsar=1,eq=brightness=0.03:saturation=1.06" '
                                                   f'-an -c:v libx264 -preset veryfast -crf 22 {out}', 280)
                                              S["BG"] = "ok:Pixabay"; return True
                          except Exception: pass
                  S["BG"] = "FAIL"; return False
              except Exception as e:
                  S["BG"] = f"crash:{str(e)[:40]}"; return False

          # ========== FONTS / DRAW ==========
          FONTS = {
              "ar": ["/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"],
              "hi": ["/usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf"],
              "en": ["/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf",
                     "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"],
          }
          FC = {}

          def F(sz, sc="en"):
              k = (sz, sc)
              if k in FC: return FC[k]
              for p in FONTS.get(sc, FONTS["en"]):
                  if os.path.exists(p):
                      try:
                          f = ImageFont.truetype(p, sz); FC[k] = f; return f
                      except Exception: continue
              f = ImageFont.load_default(); FC[k] = f; return f

          def ARR(t):
              if not t or not AR: return t
              try: return get_display(arabic_reshaper.reshape(t))
              except Exception: return t

          def SH(d, pos, txt, font, fill, **kw):
              x, y = pos
              d.text((x+3, y+3), txt, font=font, fill=(0,0,0,200), **kw)
              d.text((x, y), txt, font=font, fill=fill, **kw)

          def WR(txt, font, mw):
              words = txt.split(); lines = []; cur = ""
              for w in words:
                  t = (cur + " " + w).strip()
                  bb = font.getbbox(t)
                  if bb[2]-bb[0] <= mw: cur = t
                  else:
                      if cur: lines.append(cur)
                      cur = w
              if cur: lines.append(cur)
              return lines

          def DINTRO(img, d, t, dur):
              a = min(1.0, t/0.6)
              fa = F(50,"ar"); ft = F(44,"en"); g = (255,215,0)
              b = ARR("بِسْمِ ٱللَّٰهِ")
              bb = d.textbbox((0,0), b, font=fa); w = bb[2]-bb[0]
              SH(d, ((1080-w)//2, 400), b, fa, (*g, int(255*a)))
              tp = min(1.0, max(0.0, (t/dur-0.28)/0.42))
              if tp > 0:
                  tt = "HADITH OF THE DAY"
                  bt = d.textbbox((0,0), tt, font=ft); wt = bt[2]-bt[0]
                  SH(d, ((1080-wt)//2, 1070), tt, ft, (*g, int(255*tp)))

          def DMAIN(img, d, mt, vd, tar, ar, en, lbl, logo):
              ov = Image.new("RGBA", (1080,1920), (0,0,0,150)); img.alpha_composite(ov)
              if lbl:
                  f = F(22,"en"); bb = d.textbbox((0,0), lbl, font=f); w = bb[2]-bb[0]
                  d.rounded_rectangle([40,145,40+w+28,192], radius=11,
                                      fill=(12,10,5,240), outline=(212,175,55,255), width=2)
                  d.text((54,156), lbl, fill=(238,214,145), font=f)
              if logo and os.path.exists("avatar.png"):
                  try:
                      lg = Image.open("avatar.png").convert("RGBA").resize((180,74), Image.Resampling.LANCZOS)
                      img.paste(lg, (1080-210, 25), lg)
                  except Exception: pass
              pink = (255,148,188); cyan = (110,218,255); soft = (255,218,208)
              y = 290
              fh = F(40,"hi"); fa = F(38,"ar"); fl = F(28,"en")
              if tar:
                  for line in WR(tar, fh, 940)[:4]:
                      bb = d.textbbox((0,0), line, font=fh); tw = bb[2]-bb[0]
                      SH(d, ((1080-tw)//2, y), line, fh, (*pink, 255)); y += 62
                  y += 12
              if ar:
                  for line in WR(ARR(ar), fa, 920)[:3]:
                      bb = d.textbbox((0,0), line, font=fa); tw = bb[2]-bb[0]
                      SH(d, ((1080-tw)//2, y), line, fa, (*cyan, 255)); y += 58
                  y += 12
              if en:
                  w = en.split(); se = " ".join(w[:16]) + ("..." if len(w)>16 else "")
                  for line in WR(se, fl, 960)[:3]:
                      bb = d.textbbox((0,0), line, font=fl); tw = bb[2]-bb[0]
                      SH(d, ((1080-tw)//2, y), line, fl, (*soft, 235)); y += 46
              mx = 55; bw = 1080-mx*2; by = 1920-45
              d.rounded_rectangle([mx,by,mx+bw,by+5], radius=3, fill=(0,0,0,160))
              pw = int(bw * min(1.0, mt/max(vd,1)))
              if pw > 0:
                  d.rounded_rectangle([mx,by,mx+pw,by+5], radius=3, fill=(212,175,55,255))

          def DOUTRO(img, d, t, dur):
              a = min(1.0, t/0.55)
              fo = F(52,"en"); fs = F(28,"en"); fb = F(24,"en"); g = (232,205,135)
              bb = d.textbbox((0,0), "JazakAllah Khair", font=fo); w = bb[2]-bb[0]
              SH(d, ((1080-w)//2, 750), "JazakAllah Khair", fo, (*g, int(255*a)))
              c = "Like  •  Share  •  Follow"
              bb2 = d.textbbox((0,0), c, font=fs); w2 = bb2[2]-bb2[0]
              SH(d, ((1080-w2)//2, 890), c, fs, (255,255,255, int(255*a)))
              b = "Sawaj Studio"
              bb3 = d.textbbox((0,0), b, font=fb); w3 = bb3[2]-bb3[0]
              SH(d, ((1080-w3)//2, 1010), b, fb, (212,175,55, int(255*a)))

          # ========== AUDIO ==========
          def MASTER(inp, out):
              try:
                  subprocess.run(f'ffmpeg -nostdin -y -i "{inp}" -af "atempo=0.90,'
                                 f'afade=t=in:st=0:d=0.9,loudnorm=I=-14:TP=-1.5:LRA=11,'
                                 f'volume=1.35" "{out}"', shell=True, check=True,
                                 stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL,
                                 stderr=subprocess.DEVNULL, timeout=160)
                  return out
              except Exception:
                  shutil.copy(inp, out); return out

          def MP3D(path):
              try: return MP3(path).info.length
              except Exception: return 0.0

          def MIX(v, m, o, vol=0.11):
              try:
                  vlen = MP3D(v); fade = max(0.7, vlen - 1.8)
                  subprocess.run(f'ffmpeg -nostdin -y -i "{v}" -i "{m}" '
                                 f'-filter_complex "[1:a]volume={vol},afade=t=in:st=0:d=1.6,'
                                 f'afade=t=out:st={fade}:d=1.6[bg];[0:a][bg]amix=inputs=2:'
                                 f'duration=first[aout]" -map "[aout]" -c:a libmp3lame -b:a 192k "{o}"',
                                 shell=True, check=True, stdin=subprocess.DEVNULL,
                                 stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=180)
                  return True
              except Exception:
                  shutil.copy(v, o); return False

          # ========== DRIVE ==========
          def DRIVE(path):
              if not os.path.exists(path): return None, None
              try:
                  from google.oauth2.credentials import Credentials
                  from googleapiclient.discovery import build
                  from googleapiclient.http import MediaFileUpload
                  cr = Credentials(None, refresh_token=E("GOOGLE_DRIVE_REFRESH_TOKEN"),
                                   client_id=E("GOOGLE_DRIVE_CLIENT_ID"),
                                   client_secret=E("GOOGLE_DRIVE_CLIENT_SECRET"),
                                   token_uri="https://oauth2.googleapis.com/token")
                  srv = build("drive","v3", credentials=cr, cache_discovery=False)
                  meta = {"name": f"Story_{int(time.time())}.mp4"}
                  if E("GDRIVE_STORY_VIDEO_FOLDER_ID"):
                      meta["parents"] = [E("GDRIVE_STORY_VIDEO_FOLDER_ID")]
                  media = MediaFileUpload(path, mimetype="video/mp4", resumable=True, chunksize=5*1024*1024)
                  req = srv.files().create(body=meta, media_body=media, fields="id")
                  resp = None
                  while resp is None:
                      _, resp = req.next_chunk()
                  fid = resp.get("id")
                  if not fid: return None, None
                  try:
                      srv.permissions().create(fileId=fid, body={"type":"anyone","role":"reader"}).execute()
                  except Exception: pass
                  S["Drive"] = f"ok:{fid}"
                  log(f"Drive OK: {fid}")
                  return (f"https://drive.google.com/file/d/{fid}/view",
                          f"https://drive.google.com/uc?id={fid}&export=download&confirm=t")
              except Exception as e:
                  S["Drive"] = "FAIL"; ER.append(f"Drive: {str(e)[:100]}")
                  return None, None

          # ========== FB ==========
          def FBUP(s, path, cap):
              tok = E("FB_PAGE_ACCESS_TOKEN"); pid = E("FACEBOOK_PAGE_ID")
              if not (tok and pid):
                  S["FB"] = "skip:no-creds"; return False
              for i in range(3):
                  try:
                      with open(path,"rb") as f:
                          r = s.post(f"https://graph.facebook.com/v22.0/{pid}/video_stories",
                                     data={"access_token":tok,"description":cap},
                                     files={"source":f}, timeout=550).json()
                      if r.get("id"):
                          S["FB"] = f"ok:{r['id']}"; return True
                      log(f"FB try{i+1}: {str(r.get('error',{}))[:80]}", "WARN")
                  except Exception as e:
                      log(f"FB try{i+1}: {str(e)[:80]}", "WARN")
                  if i < 2: time.sleep(5*(i+1))
              S["FB"] = "FAIL"; ER.append("FB: all retries failed"); return False

          # ========== IG ==========
          def GET_IG_ID(s):
              ig = E("INSTAGRAM_BUSINESS_ACCOUNT_ID")
              if ig: return ig
              pid = E("FACEBOOK_PAGE_ID"); tok = E("FB_PAGE_ACCESS_TOKEN")
              if not (pid and tok): return None
              try:
                  r = s.get(f"https://graph.facebook.com/v22.0/{pid}",
                            params={"fields":"instagram_business_account","access_token":tok},
                            timeout=30).json()
                  ib = r.get("instagram_business_account")
                  if ib and ib.get("id"):
                      log(f"IG id auto: {ib['id']}"); return ib["id"]
              except Exception: pass
              return None

          def IGUP(s, url, cap):
              ig_tok = E("IG_ACCESS_TOKEN") or E("FB_PAGE_ACCESS_TOKEN")
              if not (ig_tok and url):
                  S["IG"] = "skip:no-creds"; return False
              ig_id = GET_IG_ID(s)
              if not ig_id:
                  S["IG"] = "skip:no-ig-id"; return False
              try:
                  r = s.post(f"https://graph.facebook.com/v22.0/{ig_id}/media",
                             data={"media_type":"STORIES","video_url":url,"caption":cap,
                                   "access_token":ig_tok}, timeout=80).json()
                  if "error" in r:
                      S["IG"] = f"FAIL:{str(r['error'])[:45]}"
                      ER.append(f"IG: {str(r['error'])[:100]}"); return False
                  cid = r.get("id")
                  for _ in range(80):
                      time.sleep(7)
                      st = s.get(f"https://graph.facebook.com/v22.0/{cid}",
                                 params={"fields":"status_code","access_token":ig_tok},
                                 timeout=30).json()
                      sc = st.get("status_code")
                      if sc == "FINISHED": break
                      if sc == "ERROR":
                          S["IG"] = "FAIL:processing"; ER.append("IG: processing error"); return False
                  p = s.post(f"https://graph.facebook.com/v22.0/{ig_id}/media_publish",
                             data={"creation_id":cid,"access_token":ig_tok}, timeout=50).json()
                  if p.get("id"):
                      S["IG"] = f"ok:{p['id']}"; return True
                  S["IG"] = f"FAIL:{str(p)[:45]}"; ER.append(f"IG pub: {str(p)[:100]}")
              except Exception as e:
                  S["IG"] = "FAIL"; ER.append(f"IG: {str(e)[:100]}")
              return False

          # ========== TELEGRAM MULTI-MESSAGE ==========
