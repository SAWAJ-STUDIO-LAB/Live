          FC = {}

          def F(sz, sc="en"):
              k = (sz, sc)
              if k in FC: return FC[k]
              for p in FONTS.get(sc, FONTS["en"]):
                  if os.path.exists(p):
                      try:
                          f = ImageFont.truetype(p, sz); FC[k] = f; return f
                      except Exception: continue
              f = ImageFont.load_default(); FC[k] = f; return f

          def ARR(t):
              if not t or not AR: return t
              try: return get_display(arabic_reshaper.reshape(t))
              except Exception: return t

          def SH(d, pos, txt, font, fill, **kw):
              x, y = pos
              d.text((x+3, y+3), txt, font=font, fill=(0,0,0,200), **kw)
              d.text((x, y), txt, font=font, fill=fill, **kw)

          def WR(txt, font, mw):
              if not txt: return []
              words = txt.split(); lines = []; cur = ""
              for w in words:
                  t = (cur + " " + w).strip()
                  bb = font.getbbox(t)
                  if bb[2]-bb[0] <= mw: cur = t
                  else:
                      if cur: lines.append(cur)
                      cur = w
              if cur: lines.append(cur)
              return lines

          def DINTRO(img, d, t, dur):
              a = min(1.0, t/0.6)
              fa = F(50,"ar"); ft = F(44,"en"); g = (255,215,0)
              b = ARR("بِسْمِ ٱللَّٰهِ")
              bb = d.textbbox((0,0), b, font=fa); w = bb[2]-bb[0]
              SH(d, ((1080-w)//2, 400), b, fa, (*g, int(255*a)))
              tp = min(1.0, max(0.0, (t/dur-0.28)/0.42))
              if tp > 0:
                  tt = "HADITH OF THE DAY"
                  bt = d.textbbox((0,0), tt, font=ft); wt = bt[2]-bt[0]
                  SH(d, ((1080-wt)//2, 1070), tt, ft, (*g, int(255*tp)))

          def DMAIN(img, d, mt, vd, tar, ar, en, lbl, logo):
              ov = Image.new("RGBA", (1080,1920), (0,0,0,150)); img.alpha_composite(ov)
              if lbl:
                  f = F(22,"en"); bb = d.textbbox((0,0), lbl, font=f); w = bb[2]-bb[0]
                  d.rounded_rectangle([40,145,40+w+28,192], radius=11,
                                      fill=(12,10,5,240), outline=(212,175,55,255), width=2)
                  d.text((54,156), lbl, fill=(238,214,145), font=f)
              if logo and os.path.exists("avatar.png"):
                  try:
                      lg = Image.open("avatar.png").convert("RGBA").resize((180,74), Image.Resampling.LANCZOS)
                      img.paste(lg, (1080-210, 25), lg)
                  except Exception: pass
              pink = (255,148,188); cyan = (110,218,255); soft = (255,218,208)
              y = 290
              fh = F(40,"hi"); fa = F(38,"ar"); fl = F(28,"en")
              if tar:
                  for line in WR(tar, fh, 940)[:4]:
                      bb = d.textbbox((0,0), line, font=fh); tw = bb[2]-bb[0]
                      SH(d, ((1080-tw)//2, y), line, fh, (*pink, 255)); y += 62
                  y += 12
              if ar:
                  for line in WR(ARR(ar), fa, 920)[:3]:
                      bb = d.textbbox((0,0), line, font=fa); tw = bb[2]-bb[0]
                      SH(d, ((1080-tw)//2, y), line, fa, (*cyan, 255)); y += 58
                  y += 12
              if en:
                  w = en.split(); se = " ".join(w[:16]) + ("..." if len(w)>16 else "")
                  for line in WR(se, fl, 960)[:3]:
                      bb = d.textbbox((0,0), line, font=fl); tw = bb[2]-bb[0]
                      SH(d, ((1080-tw)//2, y), line, fl, (*soft, 235)); y += 46
              mx = 55; bw = 1080-mx*2; by = 1920-45
              d.rounded_rectangle([mx,by,mx+bw,by+5], radius=3, fill=(0,0,0,160))
              pw = int(bw * min(1.0, mt/max(vd,1)))
              if pw > 0:
                  d.rounded_rectangle([mx,by,mx+pw,by+5], radius=3, fill=(212,175,55,255))

