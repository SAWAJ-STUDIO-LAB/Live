              except Exception as e: log(f"0x0.st fail: {str(e)[:60]}", "WARN")
              # Try catbox.moe
              try:
                  with open(path,"rb") as f:
                      r = requests.post("https://catbox.moe/user/api.php",
                                        data={"reqtype":"fileupload"},
