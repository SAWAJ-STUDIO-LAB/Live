          # ========== DRIVE ==========
          def DRIVE(path):
              if not os.path.exists(path): return None
              for attempt in range(3):
                  try:
                      from google.oauth2.credentials import Credentials
                      from googleapiclient.discovery import build
                      from googleapiclient.http import MediaFileUpload
                      cr = Credentials(None, refresh_token=E("GOOGLE_DRIVE_REFRESH_TOKEN"),
                                       client_id=E("GOOGLE_DRIVE_CLIENT_ID"),
                                       client_secret=E("GOOGLE_DRIVE_CLIENT_SECRET"),
                                       token_uri="https://oauth2.googleapis.com/token")
                      srv = build("drive","v3", credentials=cr, cache_discovery=False)
                      meta = {"name": f"Story_{int(time.time())}.mp4"}
                      if E("GDRIVE_STORY_VIDEO_FOLDER_ID"):
                          meta["parents"] = [E("GDRIVE_STORY_VIDEO_FOLDER_ID")]
                      media = MediaFileUpload(path, mimetype="video/mp4", resumable=True, chunksize=5*1024*1024)
                      req = srv.files().create(body=meta, media_body=media, fields="id")
                      resp = None
                      while resp is None:
                          _, resp = req.next_chunk()
                      fid = resp.get("id")
                      if not fid: continue
                      try:
                          srv.permissions().create(fileId=fid, body={"type":"anyone","role":"reader"}).execute()
                      except Exception: pass
                      S["Drive"] = f"ok:{fid}"
                      log(f"Drive OK: {fid}")
                      return f"https://drive.google.com/uc?id={fid}&export=download&confirm=t"
                  except Exception as e:
                      log(f"Drive try{attempt+1}: {str(e)[:80]}", "WARN")
                      if attempt < 2: time.sleep(5)
              S["Drive"] = "FAIL"
              return None

