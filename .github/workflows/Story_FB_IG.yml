              s3 += f"🎬 Duration: {vd:.1f}s\n🖼️ Frames: {nf}\n📦 Size: {vz:.1f} MB\n🎞️ 1080x1920 @ 25fps"
              _tg_msg(tok, cid, s3); time.sleep(1)

              # MSG 4: Upload status
              s4 = "📤 UPLOAD STATUS\n━━━━━━━━━━━━━━━━━━━━━━\n"
              s4 += f"☁️ Drive: {S['Drive']}\n📘 Facebook: {S['FB']}\n📸 Instagram: {S['IG']}\n"
              s4 += "━━━━━━━━━━━━━━━━━━━━━━\n"
