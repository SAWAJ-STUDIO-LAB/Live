name: 🧑‍💻🛠️ Sawaj_Studio_Bot_Story_FB_IG

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (online = Drive + FB + IG | offline_test = Drive only)'
        required: true
        default: 'online'
        type: choice
        options:
          - 'online'
          - 'offline_test'

permissions:
  contents: write

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-color-emoji fonts-noto-cjk
          pip install --quiet requests urllib3 Pillow mutagen edge-tts google-auth google-auth-oauthlib google-api-python-client

      - name: Run Video Pipeline
        env:
          UPLOAD_MODE: ${{ github.event.inputs.mode || 'online' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
          QURAN_API_URL: ${{ secrets.QURAN_API_URL }}
          OPENROUTER_API_KEY_AI: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY_AI: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY_AI: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY_AI: ${{ secrets.MISTRAL_API_KEY_AI }}
          COHERE_API_KEY_AI: ${{ secrets.COHERE_API_KEY_AI }}
          HUGGINGFACE_API_KEY_AI: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
          CEREBRAS_API_KEY_AI: ${{ secrets.CEREBRAS_API_KEY_AI }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          POLLINATIONS_API_URL: ${{ secrets.POLLINATIONS_API_URL }}
          LIBRETRANSLATE_URL: ${{ secrets.LIBRETRANSLATE_URL }}
          DEEPLX_URL: ${{ secrets.DEEPLX_URL }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICECAFE_API_URL: ${{ secrets.VOICECAFE_API_URL }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          FREESOUND_MUSIC_URL: ${{ secrets.FREESOUND_MUSIC_URL }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GDRIVE_STORY_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: |
          mkdir -p _work && cd _work
          cat > bot.py << 'PYEOF'
          import os, time, subprocess, shutil, random, base64, traceback, json
          from datetime import datetime
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          from PIL import Image, ImageDraw, ImageFont
          from mutagen.mp3 import MP3

          C = {k: os.environ.get(k, "").strip() for k in [
              "UPLOAD_MODE","TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID","HADITH_API_URL","QURAN_API_URL",
              "OPENROUTER_API_KEY_AI","GROQ_API_KEY_AI","GEMINI_API_KEY_AI","MISTRAL_API_KEY_AI",
              "COHERE_API_KEY_AI","HUGGINGFACE_API_KEY_AI","CEREBRAS_API_KEY_AI","DEEPSEEK_API_KEY",
              "POLLINATIONS_API_URL","LIBRETRANSLATE_URL","DEEPLX_URL","SARVAM_API_KEY",
              "ELEVENLABS_API_KEY","VOICECAFE_API_URL","DEEPGRAM_API_KEY","FREESOUND_API_KEY",
              "FREESOUND_MUSIC_URL","PIXABAY_API_KEY","JAMENDO_CLIENT_ID","PEXELS_API_KEY",
              "GOOGLE_DRIVE_CLIENT_ID","GOOGLE_DRIVE_CLIENT_SECRET","GOOGLE_DRIVE_REFRESH_TOKEN",
              "GDRIVE_STORY_VIDEO_FOLDER_ID","FACEBOOK_PAGE_ID","FB_PAGE_ACCESS_TOKEN",
              "INSTAGRAM_BUSINESS_ACCOUNT_ID"
          ]}
          C["MODE"] = C.get("UPLOAD_MODE","online").lower()

          STATUS = {"AI":"Not Used","TTS":"Not Used","Music":"Not Used","BG":"Not Used","Drive":"Not Used","FB":"Skipped","IG":"Skipped"}
          ERRORS = []

          def log(m, lv="INFO"):
              print(f"[{datetime.now():%H:%M:%S}] [{lv}] {m}", flush=True)

          def runc(cmd, t=1800):
              log("CMD: " + cmd[:100])
              subprocess.run(cmd, shell=True, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=t)

          def sess():
              s = requests.Session()
              r = Retry(total=4, backoff_factor=1.5, status_forcelist=[429,500,502,503,504])
              s.mount("https://", HTTPAdapter(max_retries=r))
              s.headers.update({"User-Agent":"SawajStudioBot/4.0"})
              return s

          def dl(s, url, path, min_sz=8000):
              for _ in range(3):
                  try:
                      r = s.get(url, timeout=80, stream=True)
                      if r.status_code != 200: continue
                      w = 0
                      with open(path,"wb") as f:
                          for c in r.iter_content(65536):
                              if c:
                                  w += len(c)
                                  f.write(c)
                      if w > min_sz: return True
                  except: pass
              return False

          def fetch_hadith(s):
              books = [("eng-bukhari","ara-bukhari","Sahih al-Bukhari",7000),("eng-muslim","ara-muslim","Sahih Muslim",5000)]
              bases = [C["HADITH_API_URL"].rstrip("/")] if C["HADITH_API_URL"] else []
              bases.append("https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1")
              for _ in range(40):
                  e,a,n,m = random.choice(books)
                  num = random.randint(1,m)
                  for b in bases:
                      try:
                          r = s.get(f"{b}/editions/{e}/{num}.json", timeout=12)
                          if r.status_code != 200: continue
                          hh = r.json().get("hadiths",[])
                          if not hh: continue
                          txt = hh[0].get("text","").strip()
                          if len(txt.split()) < 15 or len(txt.split()) > 45: continue
                          ar = ""
                          try:
                              ar_r = s.get(f"{b}/editions/{a}/{num}.json", timeout=10)
                              if ar_r.status_code==200:
                                  ad = ar_r.json().get("hadiths",[])
                                  if ad: ar = ad[0].get("text","").strip()
                          except: pass
                          return {"collection":n,"number":str(hh[0].get("hadithnumber") or num),"english":txt,"arabic":ar}
                      except: continue
              return {"collection":"Sahih al-Bukhari","number":"1","english":"The reward of deeds depends upon the intentions.","arabic":"إنما الأعمال بالنيات"}

          def fetch_quran(s):
              if not C["QURAN_API_URL"]: return ""
              try:
                  n = random.randint(1,114)
                  r = s.get(f"{C['QURAN_API_URL'].rstrip('/')}/v1/surah/{n}", timeout=12)
                  if r.status_code==200:
                      ay = r.json().get("data",{}).get("ayahs",[])
                      if ay: return ay[0].get("text","")
              except: pass
              return ""

          def ai_call(s, prompt):
              providers = []
              def oai(url, key, model):
                  def f():
                      r = s.post(url, headers={"Authorization":f"Bearer {key}","Content-Type":"application/json"},
                          json={"model":model,"messages":[{"role":"user","content":prompt}],"temperature":0.5,"max_tokens":500}, timeout=60)
                      if r.status_code==200: return r.json()["choices"][0]["message"]["content"].strip()
                      raise Exception(f"HTTP {r.status_code}")
                  return f
              def gem():
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={C['GEMINI_API_KEY_AI']}"
                  r = s.post(url, json={"contents":[{"parts":[{"text":prompt}]}]}, timeout=60)
                  if r.status_code==200: return r.json()["candidates"][0]["content"]["parts"][0]["text"].strip()
                  raise Exception(f"HTTP {r.status_code}")
              def coh():
                  r = s.post("https://api.cohere.com/v1/chat", headers={"Authorization":f"Bearer {C['COHERE_API_KEY_AI']}","Content-Type":"application/json"},
                      json={"model":"command-r-plus","message":prompt}, timeout=60)
                  if r.status_code==200: return r.json().get("text","").strip()
                  raise Exception(f"HTTP {r.status_code}")
              def hf():
                  r = s.post("https://api-inference.huggingface.co/models/meta-llama/Meta-Llama-3-8B-Instruct",
                      headers={"Authorization":f"Bearer {C['HUGGINGFACE_API_KEY_AI']}"},
                      json={"inputs":prompt,"parameters":{"max_new_tokens":500,"temperature":0.5,"return_full_text":False}}, timeout=90)
                  if r.status_code==200:
                      d = r.json()
                      if isinstance(d,list) and d: return d[0].get("generated_text","").strip()
                  raise Exception(f"HTTP {r.status_code}")
              def ds():
                  r = s.post("https://api.deepseek.com/chat/completions", headers={"Authorization":f"Bearer {C['DEEPSEEK_API_KEY']}","Content-Type":"application/json"},
                      json={"model":"deepseek-chat","messages":[{"role":"user","content":prompt}],"max_tokens":500}, timeout=60)
                  if r.status_code==200: return r.json()["choices"][0]["message"]["content"].strip()
                  raise Exception(f"HTTP {r.status_code}")
              def pol():
                  b = C["POLLINATIONS_API_URL"].rstrip("/")
                  r = s.post(f"{b}/openai", json={"model":"openai","messages":[{"role":"user","content":prompt}]}, timeout=60)
                  if r.status_code==200: return r.json()["choices"][0]["message"]["content"].strip()
                  raise Exception(f"HTTP {r.status_code}")

              if C["GROQ_API_KEY_AI"]: providers.append(("Groq", oai("https://api.groq.com/openai/v1/chat/completions", C["GROQ_API_KEY_AI"], "llama-3.3-70b-versatile")))
              if C["GEMINI_API_KEY_AI"]: providers.append(("Gemini", gem))
              if C["OPENROUTER_API_KEY_AI"]: providers.append(("OpenRouter", oai("https://openrouter.ai/api/v1/chat/completions", C["OPENROUTER_API_KEY_AI"], "openai/gpt-4o-mini")))
              if C["MISTRAL_API_KEY_AI"]: providers.append(("Mistral", oai("https://api.mistral.ai/v1/chat/completions", C["MISTRAL_API_KEY_AI"], "mistral-small-latest")))
              if C["COHERE_API_KEY_AI"]: providers.append(("Cohere", coh))
              if C["HUGGINGFACE_API_KEY_AI"]: providers.append(("HF", hf))
              if C["DEEPSEEK_API_KEY"]: providers.append(("DeepSeek", ds))
              if C["POLLINATIONS_API_URL"]: providers.append(("Pollinations", pol))

              for name, fn in providers:
                  try:
                      out = fn()
                      if out and len(out) > 15:
                          STATUS["AI"] = f"Success ({name})"
                          log(f"AI OK → {name}")
                          return out
                  except Exception as e:
                      ERRORS.append(f"AI {name}: {str(e)[:50]}")
                      log(f"AI FAIL {name}: {str(e)[:60]}", "WARN")
              STATUS["AI"] = "Failed"
              return ""

          def get_meaning(s, eng):
              prompt = f"Translate this Hadith into short pure Hindi. Give Matlab and short Naseehah in Hindi. Keep short.\n\nHadith: {eng}\n\nFormat:\nTarjuma: ...\nMatlab: ...\nNaseehah: ..."
              res = ai_call(s, prompt)
              tarjuma = matlab = naseehah = ""
              if "Tarjuma:" in res and "Matlab:" in res and "Naseehah:" in res:
                  p1 = res.split("Matlab:")
                  tarjuma = p1[0].replace("Tarjuma:","").strip()
                  p2 = p1[1].split("Naseehah:")
                  matlab = p2[0].strip()
                  naseehah = p2[1].strip()
              else:
                  tarjuma = res.strip()
              return tarjuma or "Amal ka daromadar niyaton par hai.", matlab or "Niyat sabse pehle.", naseehah or "Pure niyat se kaam karo."

          def translate(s, text):
              if C["LIBRETRANSLATE_URL"]:
                  try:
                      r = s.post(f"{C['LIBRETRANSLATE_URL'].rstrip('/')}/translate", json={"q":text,"source":"en","target":"hi","format":"text"}, timeout=25)
                      if r.status_code==200:
                          t = r.json().get("translatedText","")
                          if t: return t
                  except: pass
              if C["DEEPLX_URL"]:
                  try:
                      r = s.post(f"{C['DEEPLX_URL'].rstrip('/')}/translate", json={"text":text,"source_lang":"EN","target_lang":"HI"}, timeout=25)
                      if r.status_code==200:
                          t = r.json().get("data","")
                          if t: return t
                  except: pass
              return ""

          def tts(s, text, out):
              # Free first
              if C["SARVAM_API_KEY"]:
                  try:
                      r = s.post("https://api.sarvam.ai/text-to-speech",
                          headers={"api-subscription-key":C["SARVAM_API_KEY"],"Content-Type":"application/json"},
                          json={"inputs":[text[:420]],"target_language_code":"hi-IN","speaker":"meera","pitch":0,"pace":0.85,"loudness":1.25,"speech_sample_rate":22050,"enable_preprocessing":True,"model":"bulbul:v1"}, timeout=120)
                      if r.status_code==200:
                          a = r.json().get("audios",[])
                          if a:
                              with open(out,"wb") as f: f.write(base64.b64decode(a[0]))
                              STATUS["TTS"]="Success (Sarvam)"; return True
                  except Exception as e: ERRORS.append(f"TTS Sarvam: {str(e)[:40]}")
              if C["VOICECAFE_API_URL"]:
                  try:
                      r = s.post(f"{C['VOICECAFE_API_URL'].rstrip('/')}/api/tts", json={"text":text[:800],"language":"hi","voice":"default","format":"mp3"}, timeout=100)
                      if r.status_code==200 and len(r.content)>3000:
                          with open(out,"wb") as f: f.write(r.content)
                          STATUS["TTS"]="Success (VoiceCafe)"; return True
                  except Exception as e: ERRORS.append(f"TTS VoiceCafe: {str(e)[:40]}")
              if C["DEEPGRAM_API_KEY"]:
                  try:
                      r = s.post("https://api.deepgram.com/v1/speak?model=aura-asteria-en",
                          headers={"Authorization":f"Token {C['DEEPGRAM_API_KEY']}","Content-Type":"application/json"},
                          json={"text":text[:1600]}, timeout=100)
                      if r.status_code==200 and len(r.content)>3000:
                          with open(out,"wb") as f: f.write(r.content)
                          STATUS["TTS"]="Success (Deepgram)"; return True
                  except Exception as e: ERRORS.append(f"TTS Deepgram: {str(e)[:40]}")
              if C["ELEVENLABS_API_KEY"]:
                  try:
                      r = s.post("https://api.elevenlabs.io/v1/text-to-speech/pNInz6obpgDQGcFmaJgB",
                          headers={"Accept":"audio/mpeg","Content-Type":"application/json","xi-api-key":C["ELEVENLABS_API_KEY"]},
                          json={"text":text,"model_id":"eleven_multilingual_v2","voice_settings":{"stability":0.4,"similarity_boost":0.8}}, timeout=180)
                      if r.status_code==200 and len(r.content)>3000:
                          with open(out,"wb") as f: f.write(r.content)
                          STATUS["TTS"]="Success (ElevenLabs)"; return True
                  except Exception as e: ERRORS.append(f"TTS 11Labs: {str(e)[:40]}")
              # Always free fallback
              try:
                  txt = out + ".txt"
                  with open(txt,"w",encoding="utf-8") as f: f.write(text)
                  cmd = f'edge-tts --file "{txt}" --write-media "{out}" --voice hi-IN-MadhurNeural --rate=-8% --pitch=-2Hz --volume=+10%'
                  subprocess.run(cmd, shell=True, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=280)
                  os.remove(txt)
                  if os.path.exists(out) and os.path.getsize(out)>800:
                      STATUS["TTS"]="Success (Edge)"; return True
              except Exception as e: ERRORS.append(f"TTS Edge: {str(e)[:40]}")
              STATUS["TTS"]="Failed"
              return False

          def get_music(s, out):
              queries = ["ambient islamic","soft ambient","peaceful ambient","calm ambient","meditation ambient"]
              if C["FREESOUND_API_KEY"]:
                  for q in queries:
                      try:
                          r = s.get("https://freesound.org/apiv2/search/text/",
                              params={"query":q,"token":C["FREESOUND_API_KEY"],"fields":"id,previews","filter":"duration:[18 TO 280]","page_size":6}, timeout=20)
                          if r.status_code==200:
                              for it in r.json().get("results",[]):
                                  u = it.get("previews",{}).get("preview-hq-mp3")
                                  if u and dl(s, u, out, 12000):
                                      STATUS["Music"]="Success (Freesound)"; return True
                      except: pass
              if C["FREESOUND_MUSIC_URL"]:
                  try:
                      if dl(s, C["FREESOUND_MUSIC_URL"], out, 12000):
                          STATUS["Music"]="Success (FSU)"; return True
                  except: pass
              if C["JAMENDO_CLIENT_ID"]:
                  try:
                      r = s.get("https://api.jamendo.com/v3.0/tracks/",
                          params={"client_id":C["JAMENDO_CLIENT_ID"],"format":"json","limit":6,"tags":"ambient"}, timeout=20)
                      if r.status_code==200:
                          for t in r.json().get("results",[]):
                              u = t.get("audio")
                              if u and dl(s, u, out, 12000):
                                  STATUS["Music"]="Success (Jamendo)"; return True
                  except: pass
              if C["PIXABAY_API_KEY"]:
                  try:
                      r = s.get("https://pixabay.com/api/",
                          params={"key":C["PIXABAY_API_KEY"],"q":"ambient","category":"music","per_page":6}, timeout=20)
                      if r.status_code==200:
                          for h in r.json().get("hits",[]):
                              u = h.get("audio")
                              if u and dl(s, u, out, 12000):
                                  STATUS["Music"]="Success (Pixabay)"; return True
                  except: pass
              STATUS["Music"]="Failed"
              return False

          def get_bg(s, out, dur):
              queries = ["mosque night","night sky stars","desert night islamic","islamic architecture night","prayer silhouette","crescent moon night"]
              random.shuffle(queries)
              for q in queries:
                  if C["PEXELS_API_KEY"]:
                      try:
                          r = s.get("https://api.pexels.com/videos/search",
                              headers={"Authorization":C["PEXELS_API_KEY"]},
                              params={"query":q,"orientation":"portrait","per_page":10}, timeout=15)
                          if r.status_code==200:
                              for v in r.json().get("videos",[])[:5]:
                                  ff = v.get("video_files",[])
                                  if not ff: continue
                                  pick = sorted(ff, key=lambda x: abs(x.get("width",0)-1080))[0]
                                  if pick.get("width",0) < 640: continue
                                  if dl(s, pick["link"], "tmp_bg.mp4"):
                                      cmd = f'ffmpeg -y -stream_loop -1 -i tmp_bg.mp4 -t {dur+2} -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,eq=brightness=0.03:saturation=1.05" -an -c:v libx264 -preset veryfast -crf 22 {out}'
                                      runc(cmd, 280)
                                      STATUS["BG"]=f"Success (Pexels/{q})"; return True
                      except Exception as e: ERRORS.append(f"BG Pexels: {str(e)[:40]}")
                  if C["PIXABAY_API_KEY"]:
                      try:
                          r = s.get("https://pixabay.com/api/videos/",
                              params={"key":C["PIXABAY_API_KEY"],"q":q,"orientation":"vertical","per_page":8}, timeout=15)
                          if r.status_code==200:
                              for h in r.json().get("hits",[])[:4]:
                                  for sk in ["medium","large","small"]:
                                      u = h.get("videos",{}).get(sk,{}).get("url")
                                      if u and dl(s, u, "tmp_bg.mp4"):
                                          cmd = f'ffmpeg -y -stream_loop -1 -i tmp_bg.mp4 -t {dur+2} -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,eq=brightness=0.03:saturation=1.05" -an -c:v libx264 -preset veryfast -crf 22 {out}'
                                          runc(cmd, 280)
                                          STATUS["BG"]=f"Success (Pixabay/{q})"; return True
                      except Exception as e: ERRORS.append(f"BG Pixabay: {str(e)[:40]}")
              STATUS["BG"]="Failed"
              return False

          def fget(sz, script="latin"):
              paths = {
                  "arabic": ["/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"],
                  "devanagari": ["/usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf"],
                  "latin": ["/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf","/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"]
              }
              for p in paths.get(script, paths["latin"]):
                  if os.path.exists(p):
                      try: return ImageFont.truetype(p, sz)
                      except: pass
              return ImageFont.load_default()

          def shadow(d, pos, text, font, fill, **kw):
              x,y = pos
              d.text((x+3,y+3), text, font=font, fill=(0,0,0,200), **kw)
              d.text((x,y), text, font=font, fill=fill, **kw)

          def wrap(text, font, maxw):
              words = text.split()
              lines, cur = [], ""
              for w in words:
                  test = (cur+" "+w).strip()
                  if font.getbbox(test)[2] - font.getbbox(test)[0] <= maxw:
                      cur = test
                  else:
                      if cur: lines.append(cur)
                      cur = w
              if cur: lines.append(cur)
              return lines

          def draw_intro(img, d, t, dur):
              a = min(1.0, t/0.6)
              fa = fget(50,"arabic")
              ft = fget(44,"latin")
              bb = d.textbbox((0,0),"بِسْمِ ٱللَّٰهِ",font=fa)
              w = bb[2]-bb[0]
              shadow(d, ((1080-w)//2, 400), "بِسْمِ ٱللَّٰهِ", fa, (255,215,0,int(255*a)))
              if t/dur > 0.3:
                  tp = min(1.0, (t/dur-0.3)/0.4)
                  title = "HADITH OF THE DAY"
                  bt = d.textbbox((0,0),title,font=ft)
                  wt = bt[2]-bt[0]
                  shadow(d, ((1080-wt)//2, 1070), title, ft, (255,215,0,int(255*tp)))

          def draw_main(img, d, mt, vd, tarjuma, arabic, eng, label, has_logo):
              overlay = Image.new("RGBA",(1080,1920),(0,0,0,150))
              img.alpha_composite(overlay)
              if label:
                  f = fget(22,"latin")
                  bb = d.textbbox((0,0),label,font=f)
                  w = bb[2]-bb[0]
                  d.rounded_rectangle([40,145,40+w+28,192], radius=11, fill=(12,10,5,240), outline=(212,175,55,255), width=2)
                  d.text((54,156), label, fill=(238,214,145), font=f)
              if has_logo and os.path.exists("avatar.png"):
                  try:
                      lg = Image.open("avatar.png").convert("RGBA").resize((180,74), Image.Resampling.LANCZOS)
                      img.paste(lg, (1080-210, 25), lg)
                  except: pass
              y = 280
              fh = fget(38,"devanagari")
              fa = fget(36,"arabic")
              fl = fget(28,"latin")
              if tarjuma:
                  for line in wrap(tarjuma, fh, 940)[:4]:
                      bb = d.textbbox((0,0),line,font=fh)
                      tw = bb[2]-bb[0]
                      shadow(d, ((1080-tw)//2, y), line, fh, (255,145,185,255))
                      y += 62
                  y += 12
              if arabic:
                  for line in wrap(arabic, fa, 920)[:3]:
                      bb = d.textbbox((0,0),line,font=fa,direction="rtl",language="ar")
                      tw = bb[2]-bb[0]
                      shadow(d, ((1080-tw)//2, y), line, fa, (110,210,255,255), direction="rtl", language="ar")
                      y += 58
                  y += 12
              if eng:
                  short = " ".join(eng.split()[:15]) + ("..." if len(eng.split())>15 else "")
                  for line in wrap(short, fl, 960)[:3]:
                      bb = d.textbbox((0,0),line,font=fl)
                      tw = bb[2]-bb[0]
                      shadow(d, ((1080-tw)//2, y), line, fl, (255,215,205,235))
                      y += 46
              # progress
              mx, by = 55, 1920-45
              bw = 1080 - mx*2
              d.rounded_rectangle([mx,by,mx+bw,by+5], radius=3, fill=(0,0,0,160))
              pw = int(bw * min(1.0, mt/max(vd,1)))
              if pw > 0: d.rounded_rectangle([mx,by,mx+pw,by+5], radius=3, fill=(212,175,55,255))

          def draw_outro(img, d, t, dur):
              a = min(1.0, t/0.55)
              fo = fget(52,"latin")
              fs = fget(28,"latin")
              fb = fget(24,"latin")
              bb = d.textbbox((0,0),"JazakAllah Khair",font=fo)
              w = bb[2]-bb[0]
              shadow(d, ((1080-w)//2, 750), "JazakAllah Khair", fo, (232,205,135,int(255*a)))
              cta = "Like  •  Share  •  Follow"
              bb2 = d.textbbox((0,0),cta,font=fs)
              w2 = bb2[2]-bb2[0]
              shadow(d, ((1080-w2)//2, 890), cta, fs, (255,255,255,int(255*a)))
              brand = "Sawaj Studio"
              bb3 = d.textbbox((0,0),brand,font=fb)
              w3 = bb3[2]-bb3[0]
              shadow(d, ((1080-w3)//2, 1010), brand, fb, (212,175,55,int(255*a)))

          def master(inp, outp):
              cmd = f'ffmpeg -y -i "{inp}" -af "atempo=0.90,afade=t=in:st=0:d=0.9,loudnorm=I=-14:TP=-1.5:LRA=11,volume=1.35" "{outp}"'
              try:
                  subprocess.run(cmd, shell=True, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=160)
              except:
                  shutil.copy(inp, outp)

          def mix(v, m, o):
              try:
                  vlen = MP3(v).info.length
                  fade = max(0.7, vlen-1.8)
                  cmd = f'ffmpeg -y -i "{v}" -i "{m}" -filter_complex "[1:a]volume=0.11,afade=t=in:st=0:d=1.6,afade=t=out:st={fade}:d=1.6[bg];[0:a][bg]amix=inputs=2:duration=first[aout]" -map "[aout]" -c:a libmp3lame -b:a 192k "{o}"'
                  subprocess.run(cmd, shell=True, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=180)
              except:
                  shutil.copy(v, o)

          def drive_up(path):
              if not os.path.exists(path): return None, None
              try:
                  from google.oauth2.credentials import Credentials
                  from googleapiclient.discovery import build
                  from googleapiclient.http import MediaFileUpload
                  creds = Credentials(None, refresh_token=C["GOOGLE_DRIVE_REFRESH_TOKEN"],
                      client_id=C["GOOGLE_DRIVE_CLIENT_ID"], client_secret=C["GOOGLE_DRIVE_CLIENT_SECRET"],
                      token_uri="https://oauth2.googleapis.com/token")
                  srv = build("drive","v3", credentials=creds, cache_discovery=False)
                  meta = {"name":f"Story_{int(time.time())}.mp4"}
                  if C["GDRIVE_STORY_VIDEO_FOLDER_ID"]:
                      meta["parents"] = [C["GDRIVE_STORY_VIDEO_FOLDER_ID"]]
                  media = MediaFileUpload(path, mimetype="video/mp4", resumable=True, chunksize=4*1024*1024)
                  req = srv.files().create(body=meta, media_body=media, fields="id")
                  resp = None
                  while resp is None:
                      _, resp = req.next_chunk()
                  fid = resp.get("id")
                  if not fid: return None, None
                  try:
                      srv.permissions().create(fileId=fid, body={"type":"anyone","role":"reader"}).execute()
                  except: pass
                  STATUS["Drive"] = f"Success ({fid})"
                  log(f"Drive OK: {fid}")
                  return f"https://drive.google.com/file/d/{fid}/view", f"https://drive.google.com/uc?export=download&id={fid}"
              except Exception as e:
                  STATUS["Drive"] = "Failed"
                  ERRORS.append(f"Drive: {str(e)[:80]}")
                  log(f"Drive FAIL: {e}", "WARN")
                  return None, None

          def fb_up(path, cap):
              if not (C["FB_PAGE_ACCESS_TOKEN"] and C["FACEBOOK_PAGE_ID"]):
                  STATUS["FB"] = "Skipped (No Creds)"; return
              try:
                  with open(path,"rb") as f:
                      r = requests.post(f"https://graph.facebook.com/v22.0/{C['FACEBOOK_PAGE_ID']}/video_stories",
                          data={"access_token":C["FB_PAGE_ACCESS_TOKEN"],"description":cap},
                          files={"source":f}, timeout=550).json()
                      if r.get("id"):
                          STATUS["FB"] = f"Success ({r['id']})"
                          log(f"FB OK: {r['id']}")
                      else:
                          STATUS["FB"] = f"Failed: {str(r.get('error',{}))[:50]}"
                          ERRORS.append(f"FB: {str(r.get('error',{}))[:80]}")
              except Exception as e:
                  STATUS["FB"] = "Failed"
                  ERRORS.append(f"FB: {str(e)[:80]}")

          def ig_up(url, cap):
              if not (C["FB_PAGE_ACCESS_TOKEN"] and C["INSTAGRAM_BUSINESS_ACCOUNT_ID"] and url):
                  STATUS["IG"] = "Skipped (No Creds/URL)"; return
              try:
                  r = requests.post(f"https://graph.facebook.com/v22.0/{C['INSTAGRAM_BUSINESS_ACCOUNT_ID']}/media",
                      data={"media_type":"STORIES","video_url":url,"caption":cap,"access_token":C["FB_PAGE_ACCESS_TOKEN"]}, timeout=60).json()
                  if "error" in r:
                      STATUS["IG"] = f"Failed: {str(r['error'])[:50]}"
                      ERRORS.append(f"IG: {str(r['error'])[:80]}")
                      return
                  cid = r.get("id")
                  for _ in range(70):
                      time.sleep(7)
                      st = requests.get(f"https://graph.facebook.com/v22.0/{cid}",
                          params={"fields":"status_code","access_token":C["FB_PAGE_ACCESS_TOKEN"]}, timeout=20).json()
                      if st.get("status_code") == "FINISHED": break
                      if st.get("status_code") == "ERROR":
                          STATUS["IG"] = "Failed (Processing)"; return
                  p = requests.post(f"https://graph.facebook.com/v22.0/{C['INSTAGRAM_BUSINESS_ACCOUNT_ID']}/media_publish",
                      data={"creation_id":cid,"access_token":C["FB_PAGE_ACCESS_TOKEN"]}, timeout=35).json()
                  if p.get("id"):
                      STATUS["IG"] = f"Success ({p['id']})"
                      log(f"IG OK: {p['id']}")
                  else:
                      STATUS["IG"] = f"Failed: {str(p)[:50]}"
                      ERRORS.append(f"IG Publish: {str(p)[:80]}")
              except Exception as e:
                  STATUS["IG"] = "Failed"
                  ERRORS.append(f"IG: {str(e)[:80]}")

          def report(thumb):
              if not (C["TELEGRAM_BOT_TOKEN"] and C["TELEGRAM_CHAT_ID"]): return
              msg = "📊 *Sawaj Studio Bot Report*\n\n"
              msg += f"📌 Mode: `{C['MODE'].upper()}`\n━━━━━━━━━━━━━━━━━━━━\n"
              msg += f"🤖 AI: {STATUS['AI']}\n🎙️ TTS: {STATUS['TTS']}\n🎵 Music: {STATUS['Music']}\n"
              msg += f"🎬 BG: {STATUS['BG']}\n☁️ Drive: {STATUS['Drive']}\n📘 FB: {STATUS['FB']}\n📸 IG: {STATUS['IG']}\n"
              msg += "━━━━━━━━━━━━━━━━━━━━\n"
              if ERRORS:
                  msg += "⚠️ Errors:\n" + "\n".join(f"• {e}" for e in ERRORS[:6])
                  if len(ERRORS)>6: msg += f"\n• +{len(ERRORS)-6} more"
              else:
                  msg += "✅ All OK"
              try:
                  if os.path.exists(thumb):
                      with open(thumb,"rb") as f:
                          requests.post(f"https://api.telegram.org/bot{C['TELEGRAM_BOT_TOKEN']}/sendPhoto",
                              data={"chat_id":C["TELEGRAM_CHAT_ID"],"caption":msg,"parse_mode":"Markdown"}, files={"photo":f}, timeout=30)
                  else:
                      requests.post(f"https://api.telegram.org/bot{C['TELEGRAM_BOT_TOKEN']}/sendMessage",
                          json={"chat_id":C["TELEGRAM_CHAT_ID"],"text":msg,"parse_mode":"Markdown"}, timeout=15)
              except Exception as e:
                  log(f"TG fail: {e}", "WARN")

          def main():
              log("=== SAWAJ STUDIO BOT START ===")
              s = sess()
              tmp = ["s_raw.mp3","s_v.mp3","s_voice.mp3","music.mp3","bg.mp4","tmp_bg.mp4","avatar.png"]
              thumb = "output/final/thumbnail.jpg"
              try:
                  h = None
                  tarjuma = matlab = naseehah = ""
                  vd = 0.0
                  for attempt in range(7):
                      log(f"Attempt {attempt+1}")
                      h = fetch_hadith(s)
                      log(f"Hadith #{h['number']}")
                      tarjuma, matlab, naseehah = get_meaning(s, h["english"])
                      if not tarjuma or len(tarjuma)<10:
                          tarjuma = translate(s, h["english"]) or "Amal ka daromadar niyaton par hai."
                      tts_text = f"Assalamu Alaikum. Aaj ki Hadith. {tarjuma}. Matlab: {matlab}. Naseehah: {naseehah}. Allah Hafiz."
                      if not tts(s, tts_text, "s_raw.mp3"):
                          continue
                      master("s_raw.mp3", "s_v.mp3")
                      vd = MP3("s_v.mp3").info.length
                      log(f"Duration: {vd:.1f}s")
                      if vd <= 50: break
                  if vd > 52:
                      raise Exception("No short enough Hadith")
                  quran = fetch_quran(s)
                  voice = "s_v.mp3"
                  if get_music(s, "music.mp3"):
                      mix("s_v.mp3", "music.mp3", "s_voice.mp3")
                      voice = "s_voice.mp3"
                  if not get_bg(s, "bg.mp4", vd+4):
                      raise Exception("BG failed")
                  # logo
                  for c in ["logo.png","assets/logo.png","logo.jpg"]:
                      if os.path.exists(c):
                          try:
                              im = Image.open(c).convert("RGBA")
                              if im.width > 300:
                                  r = 300/im.width
                                  im = im.resize((300,int(im.height*r)), Image.Resampling.LANCZOS)
                              b=7
                              nw,nh = im.width+b*2, im.height+b+14
                              cv = Image.new("RGBA",(nw,nh),(0,0,0,0))
                              dd = ImageDraw.Draw(cv)
                              dd.rectangle([0,0,nw-1,nh-1], outline=(212,175,55,255), width=b)
                              cv.paste(im,(b,b),im)
                              cv.save("avatar.png")
                              break
                          except: pass
                  has_logo = os.path.exists("avatar.png")
                  # frames
                  os.makedirs("s_frames", exist_ok=True)
                  fps, intro, outro = 25, 2.6, 2.9
                  total = intro + vd + outro
                  n = int(total * fps)
                  log(f"Rendering {n} frames...")
                  for i in range(n):
                      t = i / fps
                      img = Image.new("RGBA",(1080,1920),(0,0,0,0))
                      d = ImageDraw.Draw(img)
                      if t < intro:
                          draw_intro(img, d, t, intro)
                      elif t < intro+vd:
                          draw_main(img, d, t-intro, vd, tarjuma, h.get("arabic",""), h["english"],
                                    f"#{h['number']} • {h['collection']}", has_logo)
                      else:
                          draw_outro(img, d, t-(intro+vd), outro)
                      img.save(f"s_frames/frame_{i:05d}.png")
                  os.makedirs("output/final", exist_ok=True)
                  out = "output/final/Final_Story.mp4"
                  cmd = f'ffmpeg -y -i bg.mp4 -framerate 25 -i s_frames/frame_%05d.png -i {voice} -filter_complex "[0:v][1:v]overlay=0:0:shortest=1,format=yuv420p[outv]" -map "[outv]" -map 2:a -c:v libx264 -preset veryfast -crf 21 -maxrate 9M -bufsize 18M -c:a aac -b:a 192k -t {round(total,2)} -movflags +faststart {out}'
                  runc(cmd, 1700)
                  log("Video ready")
                  mid = min(int(n*0.4), n-1)
                  Image.open(f"s_frames/frame_{mid:05d}.png").save(thumb, quality=90)
                  # ALWAYS try Drive
                  log("Uploading to Drive...")
                  view_url, dl_url = drive_up(out)
                  hashtags = "#Hadith #SahihBukhari #SahihMuslim #IslamicVideo #Quran #HindiHadith #IslamicQuotes #Sunnah #Dawah #Islam #SawajStudio"
                  caption = f"Hadith: {tarjuma}\n\nMatlab: {matlab}\n\nNaseehah: {naseehah}\n\n{h.get('english','')}\n\n"
                  if quran: caption += f"{quran}\n\n"
                  caption += hashtags
                  if C["MODE"] == "offline_test":
                      STATUS["FB"] = "Skipped (Offline)"
                      STATUS["IG"] = "Skipped (Offline)"
                  else:
                      fb_up(out, caption)
                      if dl_url:
                          ig_up(dl_url, caption)
                      else:
                          STATUS["IG"] = "Failed (No Drive)"
                  log("=== ALL DONE ===")
              except Exception as e:
                  log(f"FATAL: {e}", "ERROR")
                  ERRORS.append(f"FATAL: {str(e)}")
                  log(traceback.format_exc()[:1500], "ERROR")
              finally:
                  for f in tmp:
                      try:
                          if os.path.exists(f): os.remove(f)
                      except: pass
                  shutil.rmtree("s_frames", ignore_errors=True)
                  report(thumb)

          if __name__ == "__main__":
              main()
          PYEOF
          python3 bot.py

      - name: Cleanup
        if: always()
        run: rm -rf _work
