name: Sync ON to Live Repository

on:
  push:
    branches:
      - main
      - master

jobs:
  sync-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: Push to Live Repo
        env:
          GH_PAT: ${{ secrets.TOKEN_GITHUB }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Remote setup aur push
          git remote add live https://x-access-token:${GH_PAT}@github.com/SAWAJ-STUDIO-LAB/Live.git
          git push -u live HEAD:main --force
