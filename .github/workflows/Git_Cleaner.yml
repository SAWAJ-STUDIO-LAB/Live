name: Git_Cleaner

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  deployments: write

concurrency:
  group: git-cleaner
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: Info
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          echo "========================================"
          echo "HERO MASTER ULTIMATE CLEANER — FULL STEALTH"
          echo "Time: $(date -u)"
          echo "========================================"

      # ============ WORKFLOW RUNS ============
      - name: Delete ALL workflow runs
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          CURRENT="${{ github.run_id }}"
          TOTAL=0; SKIPPED=0
          PAGE=1
          while [ $PAGE -le 500 ]; do
            RUNS=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=100&page=$PAGE" --jq '.workflow_runs[]? | "\(.id)|\(.status)"' 2>/dev/null || echo "")
            [ -z "$RUNS" ] && break
            COUNT=0
            while IFS='|' read -r RID RSTATUS; do
              [ -z "$RID" ] && continue
              COUNT=$((COUNT+1))
              if [ "$RID" == "$CURRENT" ]; then
                SKIPPED=$((SKIPPED+1))
                continue
              fi
              for i in 1 2 3; do
                if gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$RID" 2>/dev/null; then
                  TOTAL=$((TOTAL+1))
                  break
                fi
                sleep 1
              done
            done <<< "$RUNS"
            [ "$COUNT" -eq 0 ] && break
            PAGE=$((PAGE+1))
          done
          echo "Workflow runs deleted: $TOTAL | Skipped: $SKIPPED"

      # ============ CACHES ============
      - name: Delete ALL caches
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          gh cache delete --all 2>/dev/null || true
          N=0; PAGE=1
          while [ $PAGE -le 200 ]; do
            C=$(gh api "repos/${{ github.repository }}/actions/caches?per_page=100&page=$PAGE" --jq '.actions_caches[].id' 2>/dev/null || echo "")
            [ -z "$C" ] && break
            CNT=0
            while read -r CID; do
              [ -z "$CID" ] && continue
              CNT=$((CNT+1))
              if gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$CID" 2>/dev/null; then
                N=$((N+1))
              fi
            done <<< "$C"
            [ "$CNT" -eq 0 ] && break
            PAGE=$((PAGE+1))
          done
          echo "Caches deleted: $N"

      # ============ ARTIFACTS ============
      - name: Delete ALL artifacts
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          N=0; PAGE=1
          while [ $PAGE -le 200 ]; do
            A=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100&page=$PAGE" --jq '.artifacts[].id' 2>/dev/null || echo "")
            [ -z "$A" ] && break
            CNT=0
            while read -r AID; do
              [ -z "$AID" ] && continue
              CNT=$((CNT+1))
              if gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$AID" 2>/dev/null; then
                N=$((N+1))
              fi
            done <<< "$A"
            [ "$CNT" -eq 0 ] && break
            PAGE=$((PAGE+1))
          done
          echo "Artifacts deleted: $N"

      # ============ DEPLOYMENTS ============
      - name: Delete ALL deployments
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          N=0
          DEPS=$(gh api "repos/${{ github.repository }}/deployments?per_page=100" --jq '.[].id' 2>/dev/null || echo "")
          if [ -n "$DEPS" ]; then
            while read -r DID; do
              [ -z "$DID" ] && continue
              if gh api -X DELETE "repos/${{ github.repository }}/deployments/$DID" 2>/dev/null; then
                N=$((N+1))
              fi
            done <<< "$DEPS"
          fi
          echo "Deployments deleted: $N"

      # ============ RELEASES & TAGS ============
      - name: Delete ALL Releases and Tags
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          echo "Cleaning GitHub Releases and Tags..."
          # Delete all releases
          RELEASES=$(gh api "repos/${{ github.repository }}/releases" --jq '.[].id' 2>/dev/null || echo "")
          for REL_ID in $RELEASES; do
            [ -z "$REL_ID" ] && continue
            gh api -X DELETE "repos/${{ github.repository }}/releases/$REL_ID" 2>/dev/null || true
          done

          # Delete local and remote git tags
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -l | xargs -r git tag -d || true
          git push origin --tags --delete 2>/dev/null || true
          echo "Releases and Tags cleaned."

      # ============ SQUASH GIT HISTORY ============
      - name: Squash Git History (Full Stealth)
        run: |
          git checkout --orphan temp_clean_branch
          git add -A
          git commit -m "Repository Update"
          
          git branch -D main || true
          git branch -m main
          
          git push -f origin main

      # ============ REPORT ============
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          echo "================================"
          echo "HERO MASTER ULTIMATE CLEANER COMPLETE ✅"
          echo "================================"
          echo "Runs, Caches, Artifacts, Deployments, Releases, Tags & History completely wiped!"
