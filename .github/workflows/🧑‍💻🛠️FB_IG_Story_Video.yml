name: 🧑‍💻🛠️ Sawaj_Studio_Bot_Story_FB_IG

on:
  schedule:
    - cron: '30 23 * * *' # Har roz subah 5:00 AM IST
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode Select Karein (online = Drive + FB + IG, offline_test = Sirf Drive)'
        required: true
        default: 'online'
        type: choice
        options:
          - 'online'
          - 'offline_test'

permissions:
  contents: write

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-color-emoji fonts-noto-cjk
          pip install --quiet requests urllib3 Pillow mutagen edge-tts gTTS google-auth google-auth-oauthlib google-api-python-client

      - name: Run Video Pipeline
        env:
          UPLOAD_MODE: ${{ github.event.inputs.mode || 'online' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HADITH_API_URL: ${{ secrets.HADITH_API_URL }}
          QURAN_API_URL: ${{ secrets.QURAN_API_URL }}
          OPENROUTER_API_KEY_AI: ${{ secrets.OPENROUTER_API_KEY_AI }}
          GROQ_API_KEY_AI: ${{ secrets.GROQ_API_KEY_AI }}
          GEMINI_API_KEY_AI: ${{ secrets.GEMINI_API_KEY_AI }}
          MISTRAL_API_KEY_AI: ${{ secrets.MISTRAL_API_KEY_AI }}
          COHERE_API_KEY_AI: ${{ secrets.COHERE_API_KEY_AI }}
          HUGGINGFACE_API_KEY_AI: ${{ secrets.HUGGINGFACE_API_KEY_AI }}
          CEREBRAS_API_KEY_AI: ${{ secrets.CEREBRAS_API_KEY_AI }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          POLLINATIONS_API_URL: ${{ secrets.POLLINATIONS_API_URL }}
          SCALEWAY_API_URL: ${{ secrets.SCALEWAY_API_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          TAVILY_API_KEY_AI: ${{ secrets.TAVILY_API_KEY_AI }}
          LIBRETRANSLATE_URL: ${{ secrets.LIBRETRANSLATE_URL }}
          DEEPLX_URL: ${{ secrets.DEEPLX_URL }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICECAFE_API_URL: ${{ secrets.VOICECAFE_API_URL }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          FREESOUND_MUSIC_URL: ${{ secrets.FREESOUND_MUSIC_URL }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GDRIVE_STORY_VIDEO_FOLDER_ID: ${{ secrets.GDRIVE_STORY_VIDEO_FOLDER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: |
          mkdir -p _work && cd _work
          cat > Sawaj_studio_bot_story_fb_ig.py << 'PYEOF'
          # ============================================================
          # SAWAJ STUDIO BOT - STORY (FB + IG) - FINAL HARDENED VERSION
          # Nano-level checked • Zero offline leftovers • International quality
          # ============================================================
          import os, re, time, subprocess, shutil, random, math, base64, traceback, json
          from datetime import datetime
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageEnhance
          from mutagen.mp3 import MP3

          # -------------------- CONFIG --------------------
          C = {
              "MODE": os.environ.get("UPLOAD_MODE", "online").strip().lower(),
              "TG": os.environ.get("TELEGRAM_BOT_TOKEN","").strip(),
              "TG_CHAT": os.environ.get("TELEGRAM_CHAT_ID","").strip(),
              "HADITH": os.environ.get("HADITH_API_URL","").strip(),
              "QURAN": os.environ.get("QURAN_API_URL","").strip(),
              "OR": os.environ.get("OPENROUTER_API_KEY_AI","").strip(),
              "GRQ": os.environ.get("GROQ_API_KEY_AI","").strip(),
              "GEM": os.environ.get("GEMINI_API_KEY_AI","").strip(),
              "MIS": os.environ.get("MISTRAL_API_KEY_AI","").strip(),
              "COH": os.environ.get("COHERE_API_KEY_AI","").strip(),
              "HF": os.environ.get("HUGGINGFACE_API_KEY_AI","").strip(),
              "CER": os.environ.get("CEREBRAS_API_KEY_AI","").strip(),
              "DS": os.environ.get("DEEPSEEK_API_KEY","").strip(),
              "POL": os.environ.get("POLLINATIONS_API_URL","").strip(),
              "SCW": os.environ.get("SCALEWAY_API_URL","").strip(),
              "JINA": os.environ.get("JINA_API_KEY","").strip(),
              "TAV": os.environ.get("TAVILY_API_KEY_AI","").strip(),
              "LIB": os.environ.get("LIBRETRANSLATE_URL","").strip(),
              "DXL": os.environ.get("DEEPLX_URL","").strip(),
              "SAR": os.environ.get("SARVAM_API_KEY","").strip(),
              "11L": os.environ.get("ELEVENLABS_API_KEY","").strip(),
              "VCF": os.environ.get("VOICECAFE_API_URL","").strip(),
              "DPG": os.environ.get("DEEPGRAM_API_KEY","").strip(),
              "FS": os.environ.get("FREESOUND_API_KEY","").strip(),
              "FSU": os.environ.get("FREESOUND_MUSIC_URL","").strip(),
              "PX": os.environ.get("PIXABAY_API_KEY","").strip(),
              "JAM": os.environ.get("JAMENDO_CLIENT_ID","").strip(),
              "PEX": os.environ.get("PEXELS_API_KEY","").strip(),
              "GDCID": os.environ.get("GOOGLE_DRIVE_CLIENT_ID","").strip(),
              "GDCS": os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET","").strip(),
              "GDRT": os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN","").strip(),
              "GDF": os.environ.get("GDRIVE_STORY_VIDEO_FOLDER_ID","").strip(),
              "FBPID": os.environ.get("FACEBOOK_PAGE_ID","").strip(),
              "FBTOK": os.environ.get("FB_PAGE_ACCESS_TOKEN","").strip(),
              "IGID": os.environ.get("INSTAGRAM_BUSINESS_ACCOUNT_ID","").strip(),
          }

          STATUS = {
              "AI": "Not Used", "TTS": "Not Used", "Music": "Not Used",
              "BG": "Not Used", "Drive": "Not Used", "FB": "Skipped", "IG": "Skipped"
          }
          ERRORS = []

          # -------------------- UTILS --------------------
          def log(m, lv="INFO"):
              print(f"[{datetime.now():%H:%M:%S}] [{lv}] {m}", flush=True)

          def runc(cmd, t=1800):
              log("CMD: " + cmd[:130])
              subprocess.run(cmd, shell=True, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=t)

          def new_session():
              s = requests.Session()
              r = Retry(total=6, backoff_factor=1.6, status_forcelist=[429,500,502,503,504])
              s.mount("https://", HTTPAdapter(max_retries=r))
              s.headers.update({"User-Agent":"SawajStudioBot/2.1-Final"})
              return s

          def dl(sess, url, path, min_sz=10000, retries=3):
              for _ in range(retries):
                  try:
                      r = sess.get(url, timeout=100, stream=True)
                      if r.status_code != 200: continue
                      w = 0
                      with open(path,"wb") as f:
                          for c in r.iter_content(65536):
                              if not c: continue
                              w += len(c)
                              if w > 280*1024*1024: return False
                              f.write(c)
                      if w > min_sz: return True
                  except: pass
              return False

          # -------------------- HADITH + QURAN --------------------
          BOOKS = [("eng-bukhari","ara-bukhari","Sahih al-Bukhari",7000),
                   ("eng-muslim","ara-muslim","Sahih Muslim",5000)]

          def fetch_hadith(sess, mn=17, mx=50):
              bases = [C["HADITH"].rstrip("/")] if C["HADITH"] else []
              bases.append("https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1")
              for _ in range(55):
                  e,a,n,m = random.choice(BOOKS)
                  num = random.randint(1,m)
                  for b in bases:
                      try:
                          r = sess.get(f"{b}/editions/{e}/{num}.json", timeout=16)
                          if r.status_code != 200: continue
                          hh = r.json().get("hadiths",[])
                          if not hh: continue
                          txt = hh[0].get("text","").strip()
                          if len(txt) < 22: continue
                          wc = len(txt.split())
                          if not (mn <= wc <= mx): continue
                          ar = ""
                          try:
                              ar_r = sess.get(f"{b}/editions/{a}/{num}.json", timeout=12)
                              if ar_r.status_code==200:
                                  ad = ar_r.json().get("hadiths",[])
                                  if ad: ar = ad[0].get("text","").strip()
                          except: pass
                          return {"collection":n, "number":str(hh[0].get("hadithnumber") or num),
                                  "english":txt, "arabic":ar, "book":n}
                      except: continue
              return {"collection":"Sahih al-Bukhari","number":"1",
                      "english":"The reward of deeds depends upon the intentions.",
                      "arabic":"إنما الأعمال بالنيات","book":"Sahih al-Bukhari"}

          def fetch_quran(sess):
              if not C["QURAN"]: return ""
              try:
                  n = random.randint(1,114)
                  r = sess.get(f"{C['QURAN'].rstrip('/')}/v1/surah/{n}", timeout=16)
                  if r.status_code==200:
                      d = r.json().get("data",{})
                      ay = d.get("ayahs",[])
                      if ay: return ay[0].get("text","")
              except: pass
              return ""

          # -------------------- AI --------------------
          def ai_call(sess, prompt, mt=580):
              provs = []
              def _oai(url, key, model):
                  def _f():
                      r = sess.post(url, headers={"Authorization":f"Bearer {key}","Content-Type":"application/json"},
                          json={"model":model,"messages":[{"role":"user","content":prompt}],
                                "temperature":0.52,"max_tokens":mt}, timeout=75)
                      if r.status_code==200: return r.json()["choices"][0]["message"]["content"].strip()
                      raise Exception(f"HTTP {r.status_code}")
                  return _f
              def _gem():
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={C['GEM']}"
                  r = sess.post(url, json={"contents":[{"parts":[{"text":prompt}]}]}, timeout=75)
                  if r.status_code==200: return r.json()["candidates"][0]["content"]["parts"][0]["text"].strip()
                  raise Exception(f"HTTP {r.status_code}")
              def _coh():
                  r = sess.post("https://api.cohere.com/v1/chat",
                      headers={"Authorization":f"Bearer {C['COH']}","Content-Type":"application/json"},
                      json={"model":"command-r-plus","message":prompt}, timeout=75)
                  if r.status_code==200: return r.json().get("text","").strip()
                  raise Exception(f"HTTP {r.status_code}")
              def _hf():
                  r = sess.post("https://api-inference.huggingface.co/models/meta-llama/Meta-Llama-3-8B-Instruct",
                      headers={"Authorization":f"Bearer {C['HF']}","Content-Type":"application/json"},
                      json={"inputs":prompt,"parameters":{"max_new_tokens":mt,"temperature":0.52,"return_full_text":False}}, timeout=110)
                  if r.status_code==200:
                      d = r.json()
                      if isinstance(d,list) and d: return d[0].get("generated_text","").strip()
                      if isinstance(d,dict): return d.get("generated_text","").strip()
                  raise Exception(f"HTTP {r.status_code}")
              def _cer():
                  r = sess.post("https://api.cerebras.ai/v1/chat/completions",
                      headers={"Authorization":f"Bearer {C['CER']}","Content-Type":"application/json"},
                      json={"model":"llama3.1-70b","messages":[{"role":"user","content":prompt}],"max_tokens":mt}, timeout=75)
                  if r.status_code==200: return r.json()["choices"][0]["message"]["content"].strip()
                  raise Exception(f"HTTP {r.status_code}")
              def _ds():
                  r = sess.post("https://api.deepseek.com/chat/completions",
                      headers={"Authorization":f"Bearer {C['DS']}","Content-Type":"application/json"},
                      json={"model":"deepseek-chat","messages":[{"role":"user","content":prompt}],"max_tokens":mt}, timeout=75)
                  if r.status_code==200: return r.json()["choices"][0]["message"]["content"].strip()
                  raise Exception(f"HTTP {r.status_code}")
              def _pol():
                  b = C["POL"].rstrip("/")
                  r = sess.post(f"{b}/openai", headers={"Content-Type":"application/json"},
                      json={"model":"openai","messages":[{"role":"user","content":prompt}]}, timeout=75)
                  if r.status_code==200: return r.json()["choices"][0]["message"]["content"].strip()
                  raise Exception(f"HTTP {r.status_code}")

              if C["OR"]:  provs.append(("OpenRouter", _oai("https://openrouter.ai/api/v1/chat/completions", C["OR"], "openai/gpt-4o-mini")))
              if C["GRQ"]: provs.append(("Groq", _oai("https://api.groq.com/openai/v1/chat/completions", C["GRQ"], "llama-3.3-70b-versatile")))
              if C["GEM"]: provs.append(("Gemini", _gem))
              if C["MIS"]: provs.append(("Mistral", _oai("https://api.mistral.ai/v1/chat/completions", C["MIS"], "mistral-small-latest")))
              if C["COH"]: provs.append(("Cohere", _coh))
              if C["HF"]:  provs.append(("HF", _hf))
              if C["CER"]: provs.append(("Cerebras", _cer))
              if C["DS"]:  provs.append(("DeepSeek", _ds))
              if C["POL"]: provs.append(("Pollinations", _pol))

              for name, fn in provs:
                  try:
                      out = fn()
                      if out and len(out) > 25:
                          STATUS["AI"] = f"Success ({name})"
                          log(f"AI OK: {name}")
                          return out
                  except Exception as e:
                      log(f"AI FAIL {name}: {str(e)[:85]}", "WARN")
                      ERRORS.append(f"AI {name}: {str(e)[:65]}")
              STATUS["AI"] = "Failed"
              return ""

          def get_hadith_and_meaning(sess, hadith_english):
              prompt = (f"You are a senior Islamic scholar. Translate the following authentic Hadith into pure, beautiful, short and impactful Hindi. "
                        f"Then give a very brief clear meaning (Matlab) and a powerful short moral (Naseehah) in Hindi. "
                        f"Keep total under 42 seconds speaking time. No extra words.\n\n"
                        f"Hadith: {hadith_english}\n\n"
                        f"Reply EXACTLY in this format only:\n"
                        f"Tarjuma: [Hindi translation]\n"
                        f"Matlab: [Hindi meaning]\n"
                        f"Naseehah: [Short powerful moral]")
              response = ai_call(sess, prompt, 620)
              tarjuma = matlab = naseehah = ""
              if "Tarjuma:" in response and "Matlab:" in response and "Naseehah:" in response:
                  parts = response.split("Matlab:")
                  tarjuma = parts[0].replace("Tarjuma:", "").strip()
                  rest = parts[1].split("Naseehah:")
                  matlab = rest[0].strip()
                  naseehah = rest[1].strip()
              else:
                  tarjuma = response.replace("Tarjuma:", "").replace("Matlab:", "").replace("Naseehah:", "").strip()
              return tarjuma, matlab, naseehah

          # -------------------- TRANSLATE FALLBACK --------------------
          def translate(sess, text):
              if C["LIB"]:
                  try:
                      r = sess.post(f"{C['LIB'].rstrip('/')}/translate",
                          json={"q":text,"source":"en","target":"hi","format":"text"}, timeout=35)
                      if r.status_code==200:
                          t = r.json().get("translatedText","")
                          if t: log("Trans OK: Libre"); return t
                  except Exception as e: log(f"Libre FAIL: {str(e)[:70]}","WARN")
              if C["DXL"]:
                  try:
                      r = sess.post(f"{C['DXL'].rstrip('/')}/translate",
                          json={"text":text,"source_lang":"EN","target_lang":"HI"}, timeout=35)
                      if r.status_code==200:
                          t = r.json().get("data","")
                          if t: log("Trans OK: DeepLX"); return t
                  except Exception as e: log(f"DeepLX FAIL: {str(e)[:70]}","WARN")
              return ""

          # -------------------- TTS --------------------
          def tts(sess, text, out, lang="hi"):
              if C["SAR"]:
                  try:
                      r = sess.post("https://api.sarvam.ai/text-to-speech",
                          headers={"api-subscription-key":C["SAR"],"Content-Type":"application/json"},
                          json={"inputs":[text[:460]],"target_language_code":f"{lang}-IN",
                                "speaker":"meera","pitch":0,"pace":0.87,"loudness":1.28,
                                "speech_sample_rate":22050,"enable_preprocessing":True,"model":"bulbul:v1"}, timeout=140)
                      if r.status_code==200:
                          a = r.json().get("audios",[])
                          if a:
                              with open(out,"wb") as f: f.write(base64.b64decode(a[0]))
                              STATUS["TTS"] = "Success (Sarvam)"; log("TTS OK: Sarvam"); return True
                  except Exception as e: ERRORS.append(f"TTS Sarvam: {str(e)[:55]}")
              if C["11L"]:
                  try:
                      r = sess.post("https://api.elevenlabs.io/v1/text-to-speech/pNInz6obpgDQGcFmaJgB",
                          headers={"Accept":"audio/mpeg","Content-Type":"application/json","xi-api-key":C["11L"]},
                          json={"text":text,"model_id":"eleven_multilingual_v2",
                                "voice_settings":{"stability":0.42,"similarity_boost":0.88,"style":0.32}}, timeout=210)
                      if r.status_code==200 and len(r.content)>5000:
                          with open(out,"wb") as f: f.write(r.content)
                          STATUS["TTS"] = "Success (ElevenLabs)"; log("TTS OK: ElevenLabs"); return True
                  except Exception as e: ERRORS.append(f"TTS 11Labs: {str(e)[:55]}")
              if C["VCF"]:
                  try:
                      r = sess.post(f"{C['VCF'].rstrip('/')}/api/tts",
                          json={"text":text[:950],"language":lang,"voice":"default","format":"mp3"}, timeout=140)
                      if r.status_code==200 and len(r.content)>5000:
                          with open(out,"wb") as f: f.write(r.content)
                          STATUS["TTS"] = "Success (VoiceCafe)"; log("TTS OK: VoiceCafe"); return True
                  except Exception as e: ERRORS.append(f"TTS VoiceCafe: {str(e)[:55]}")
              if C["DPG"]:
                  try:
                      r = sess.post("https://api.deepgram.com/v1/speak?model=aura-asteria-en",
                          headers={"Authorization":f"Token {C['DPG']}","Content-Type":"application/json"},
                          json={"text":text[:1850]}, timeout=140)
                      if r.status_code==200 and len(r.content)>5000:
                          with open(out,"wb") as f: f.write(r.content)
                          STATUS["TTS"] = "Success (Deepgram)"; log("TTS OK: Deepgram"); return True
                  except Exception as e: ERRORS.append(f"TTS Deepgram: {str(e)[:55]}")
              try:
                  voices = {"hi":"hi-IN-MadhurNeural","ar":"ar-SA-HamedNeural","en":"en-US-ChristopherNeural"}
                  v = voices.get(lang, voices["hi"])
                  txt = out + ".txt"
                  with open(txt,"w",encoding="utf-8") as f: f.write(text)
                  cmd = f'edge-tts --file "{txt}" --write-media "{out}" --voice {v} --rate=-9% --pitch=-3Hz --volume=+12%'
                  subprocess.run(cmd, shell=True, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=320)
                  os.remove(txt)
                  if os.path.exists(out) and os.path.getsize(out)>1200:
                      STATUS["TTS"] = "Success (Edge)"; log("TTS OK: Edge"); return True
              except Exception as e: ERRORS.append(f"TTS Edge: {str(e)[:55]}")
              STATUS["TTS"] = "Failed"
              return False

          # -------------------- MUSIC --------------------
          def get_music(sess, out, dur=60):
              if C["FS"]:
                  try:
                      r = sess.get("https://freesound.org/apiv2/search/text/",
                          params={"query":"ambient islamic OR soft ambient OR peaceful ambient OR meditation ambient",
                                  "token":C["FS"],"fields":"id,previews",
                                  "filter":"duration:[22 TO 300]","page_size":10}, timeout=28)
                      if r.status_code==200:
                          for it in r.json().get("results",[]):
                              u = it.get("previews",{}).get("preview-hq-mp3")
                              if not u: continue
                              a = sess.get(u, timeout=80)
                              if a.status_code==200 and len(a.content)>18000:
                                  with open(out,"wb") as f: f.write(a.content)
                                  STATUS["Music"] = "Success (Freesound)"; return True
                  except Exception as e: ERRORS.append(f"Music Freesound: {str(e)[:55]}")
              if C["FSU"]:
                  try:
                      r = sess.get(C["FSU"], timeout=80)
                      if r.status_code==200 and len(r.content)>18000:
                          with open(out,"wb") as f: f.write(r.content)
                          STATUS["Music"] = "Success (FSU)"; return True
                  except Exception as e: ERRORS.append(f"Music FSU: {str(e)[:55]}")
              if C["JAM"]:
                  try:
                      r = sess.get("https://api.jamendo.com/v3.0/tracks/",
                          params={"client_id":C["JAM"],"format":"json","limit":8,"tags":"ambient"}, timeout=28)
                      if r.status_code==200:
                          for t in r.json().get("results",[]):
                              u = t.get("audio")
                              if not u: continue
                              a = sess.get(u, timeout=80)
                              if a.status_code==200 and len(a.content)>18000:
                                  with open(out,"wb") as f: f.write(a.content)
                                  STATUS["Music"] = "Success (Jamendo)"; return True
                  except Exception as e: ERRORS.append(f"Music Jamendo: {str(e)[:55]}")
              if C["PX"]:
                  try:
                      r = sess.get("https://pixabay.com/api/",
                          params={"key":C["PX"],"q":"ambient","category":"music","per_page":8}, timeout=28)
                      if r.status_code==200:
                          for h in r.json().get("hits",[]):
                              u = h.get("audio")
                              if not u: continue
                              a = sess.get(u, timeout=80)
                              if a.status_code==200 and len(a.content)>18000:
                                  with open(out,"wb") as f: f.write(a.content)
                                  STATUS["Music"] = "Success (Pixabay)"; return True
                  except Exception as e: ERRORS.append(f"Music Pixabay: {str(e)[:55]}")
              STATUS["Music"] = "Failed"
              return False

          # -------------------- BACKGROUND --------------------
          def get_bg(sess, out, dur=63, orient="portrait"):
              queries = ["mosque night lights","night sky stars peaceful","desert night islamic",
                         "islamic architecture night","prayer silhouette night","beautiful mosque exterior night",
                         "crescent moon night sky","soft lantern light islamic"]
              random.shuffle(queries)
              for q in queries:
                  if C["PEX"]:
                      try:
                          r = sess.get("https://api.pexels.com/videos/search",
                              headers={"Authorization":C["PEX"]},
                              params={"query":q,"orientation":orient,"per_page":14}, timeout=20)
                          if r.status_code==200:
                              for v in r.json().get("videos",[])[:7]:
                                  ff = v.get("video_files",[])
                                  if not ff: continue
                                  pick = sorted(ff, key=lambda x: abs(x.get("width",0)-1080))[0]
                                  if dl(sess, pick["link"], "tmp_bg.mp4"):
                                      cmd = (f'ffmpeg -y -stream_loop -1 -i tmp_bg.mp4 -t {dur+2} '
                                             f'-vf "scale=1080:1920:force_original_aspect_ratio=increase,'
                                             f'crop=1080:1920,setsar=1,eq=brightness=0.03:saturation=1.08" '
                                             f'-an -c:v libx264 -preset veryfast -crf 21 {out}')
                                      runc(cmd, 340)
                                      STATUS["BG"] = f"Success (Pexels/{q})"; log(f"BG OK: Pexels/{q}"); return True
                      except Exception as e: ERRORS.append(f"BG Pexels: {str(e)[:55]}")
                  if C["PX"]:
                      try:
                          ori = "vertical" if orient=="portrait" else "horizontal"
                          r = sess.get("https://pixabay.com/api/videos/",
                              params={"key":C["PX"],"q":q,"orientation":ori,"per_page":12}, timeout=20)
                          if r.status_code==200:
                              for h in r.json().get("hits",[])[:6]:
                                  for sk in ["medium","large","small"]:
                                      u = h.get("videos",{}).get(sk,{}).get("url")
                                      if not u: continue
                                      if dl(sess, u, "tmp_bg.mp4"):
                                          cmd = (f'ffmpeg -y -stream_loop -1 -i tmp_bg.mp4 -t {dur+2} '
                                                 f'-vf "scale=1080:1920:force_original_aspect_ratio=increase,'
                                                 f'crop=1080:1920,setsar=1,eq=brightness=0.03:saturation=1.08" '
                                                 f'-an -c:v libx264 -preset veryfast -crf 21 {out}')
                                          runc(cmd, 340)
                                          STATUS["BG"] = f"Success (Pixabay/{q})"; log(f"BG OK: Pixabay/{q}"); return True
                      except Exception as e: ERRORS.append(f"BG Pixabay: {str(e)[:55]}")
              STATUS["BG"] = "Failed"
              return False

          # -------------------- FONTS + DRAWING --------------------
          FONTS = {
              "arabic": ["/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf",
                         "/usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf"],
              "devanagari": ["/usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf",
                             "/usr/share/fonts/truetype/noto/NotoSansDevanagari-Regular.ttf"],
              "latin": ["/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf",
                        "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"]
          }
          FCACHE = {}

          def fget(sz, script="latin"):
              k = (sz, script)
              if k in FCACHE: return FCACHE[k]
              for p in FONTS.get(script, FONTS["latin"]):
                  if os.path.exists(p):
                      try:
                          f = ImageFont.truetype(p, sz)
                          FCACHE[k]=f; return f
                      except: continue
              f = ImageFont.load_default(); FCACHE[k]=f; return f

          def draw_shadow_text(d, pos, text, font, fill, shadow_color=(0,0,0,210), offset=(3,3), **kwargs):
              x, y = pos
              d.text((x+offset[0], y+offset[1]), text, font=font, fill=shadow_color, **kwargs)
              d.text((x, y), text, font=font, fill=fill, **kwargs)

          def wrap_text(text, font, max_width):
              words = text.split()
              lines = []
              current = ""
              for w in words:
                  test = (current + " " + w).strip()
                  bbox = font.getbbox(test)
                  if bbox[2] - bbox[0] <= max_width:
                      current = test
                  else:
                      if current: lines.append(current)
                      current = w
              if current: lines.append(current)
              return lines

          def draw_intro(img, d, t, dur):
              a = min(1.0, t/0.65)
              fa = fget(56,"arabic")
              ft = fget(50,"latin")
              gold = (255, 215, 0)
              bb = d.textbbox((0,0),"بِسْمِ ٱللَّٰهِ",font=fa)
              w = bb[2]-bb[0]
              draw_shadow_text(d, ((1080-w)//2, 390), "بِسْمِ ٱللَّٰهِ", fa, (*gold, int(255*a)))
              tp = min(1.0, max(0.0, (t/dur-0.28)/0.42))
              if tp > 0:
                  title = "HADITH OF THE DAY"
                  bt = d.textbbox((0,0), title, font=ft)
                  wt = bt[2]-bt[0]
                  draw_shadow_text(d, ((1080-wt)//2, 1060), title, ft, (*gold, int(255*tp)))

          def draw_main(img, d, mt, vd, tarjuma, arabic, english, label, has_logo):
              overlay = Image.new("RGBA", (1080, 1920), (0, 0, 0, 148))
              img.alpha_composite(overlay)

              if label:
                  f = fget(25,"latin")
                  bb = d.textbbox((0,0), label, font=f)
                  w = bb[2]-bb[0]
                  d.rounded_rectangle([48, 155, 48+w+34, 208], radius=13,
                      fill=(16,12,6,235), outline=(212,175,55,255), width=2)
                  d.text((65, 167), label, fill=(238,214,145), font=f)

              if has_logo and os.path.exists("avatar.png"):
                  try:
                      lg = Image.open("avatar.png").convert("RGBA").resize((210, 86), Image.Resampling.LANCZOS)
                      img.paste(lg, (1080-240, 32), lg)
                  except: pass

              pink = (255, 145, 185)
              cyan = (115, 215, 255)
              soft = (255, 215, 205)

              y = 300
              fh = fget(44, "devanagari")
              fa = fget(42, "arabic")
              fl = fget(34, "latin")

              if tarjuma:
                  lines = wrap_text(tarjuma, fh, 930)
                  for line in lines[:5]:
                      bbox = d.textbbox((0,0), line, font=fh)
                      tw = bbox[2]-bbox[0]
                      draw_shadow_text(d, ((1080-tw)//2, y), line, fh, (*pink, 255))
                      y += 68
                  y += 22

              if arabic:
                  lines = wrap_text(arabic, fa, 910)
                  for line in lines[:4]:
                      bbox = d.textbbox((0,0), line, font=fa, direction="rtl", language="ar")
                      tw = bbox[2]-bbox[0]
                      draw_shadow_text(d, ((1080-tw)//2, y), line, fa, (*cyan, 255), direction="rtl", language="ar")
                      y += 65
                  y += 25

              if english:
                  short_en = " ".join(english.split()[:20]) + ("..." if len(english.split())>20 else "")
                  lines = wrap_text(short_en, fl, 950)
                  for line in lines[:3]:
                      bbox = d.textbbox((0,0), line, font=fl)
                      tw = bbox[2]-bbox[0]
                      draw_shadow_text(d, ((1080-tw)//2, y), line, fl, (*soft, 235))
                      y += 52

              mx = 65
              bw = 1080 - mx*2
              by = 1920 - 52
              d.rounded_rectangle([mx, by, mx+bw, by+7], radius=4, fill=(0,0,0,165))
              pw = int(bw * min(1.0, mt / max(vd, 1)))
              if pw > 0:
                  d.rounded_rectangle([mx, by, mx+pw, by+7], radius=4, fill=(212,175,55,255))

          def draw_outro(img, d, t, dur):
              a = min(1.0, t/0.6)
              fo = fget(60, "latin")
              fs = fget(34, "latin")
              fb = fget(27, "latin")
              gold = (232, 205, 135)

              bb = d.textbbox((0,0), "JazakAllah Khair", font=fo)
              w = bb[2]-bb[0]
              draw_shadow_text(d, ((1080-w)//2, 730), "JazakAllah Khair", fo, (*gold, int(255*a)))

              cta = "Like  •  Share  •  Follow"
              bb2 = d.textbbox((0,0), cta, font=fs)
              w2 = bb2[2]-bb2[0]
              draw_shadow_text(d, ((1080-w2)//2, 870), cta, fs, (255,255,255, int(255*a)))

              brand = "Sawaj Studio"
              bb3 = d.textbbox((0,0), brand, font=fb)
              w3 = bb3[2]-bb3[0]
              draw_shadow_text(d, ((1080-w3)//2, 990), brand, fb, (212,175,55, int(255*a)))

          # -------------------- AUDIO (FIXED) --------------------
          def master(inp, outp):
              # Safe fade-in only + loudnorm (out-fade handled by total duration later)
              cmd = (f'ffmpeg -y -i "{inp}" -af "atempo=0.91,'
                     f'afade=t=in:st=0:d=1.1,'
                     f'loudnorm=I=-14:TP=-1.5:LRA=11,volume=1.42" "{outp}"')
              try:
                  subprocess.run(cmd, shell=True, check=True,
                                 stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=190)
                  return outp
              except:
                  shutil.copy(inp, outp)
                  return outp

          def mix_voice_music(v, m, o, vol=0.12):
              # Safe mix without broken out-fade
              cmd = (f'ffmpeg -y -i "{v}" -i "{m}" '
                     f'-filter_complex "[1:a]volume={vol},afade=t=in:st=0:d=2.2[bg];'
                     f'[0:a][bg]amix=inputs=2:duration=first:dropout_transition=3[aout]" '
                     f'-map "[aout]" -c:a libmp3lame -b:a 192k "{o}"')
              subprocess.run(cmd, shell=True, check=True,
                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=210)

          # -------------------- UPLOAD --------------------
          def drive_up(path, prefix="Story"):
              if not os.path.exists(path): return None, None
              try:
                  from google.oauth2.credentials import Credentials
                  from googleapiclient.discovery import build
                  from googleapiclient.http import MediaFileUpload
                  creds = Credentials(None, refresh_token=C["GDRT"], client_id=C["GDCID"],
                      client_secret=C["GDCS"], token_uri="https://oauth2.googleapis.com/token")
                  srv = build("drive","v3",credentials=creds, cache_discovery=False)
                  meta = {"name":f"{prefix}_{int(time.time())}.mp4"}
                  if C["GDF"]: meta["parents"] = [C["GDF"]]
                  media = MediaFileUpload(path, mimetype="video/mp4", resumable=True, chunksize=5*1024*1024)
                  req = srv.files().create(body=meta, media_body=media, fields="id")
                  resp = None
                  while resp is None: _, resp = req.next_chunk()
                  fid = resp.get("id")
                  if not fid: return None, None
                  try:
                      srv.permissions().create(fileId=fid, body={"type":"anyone","role":"reader"}).execute()
                  except: pass
                  STATUS["Drive"] = f"Success (ID: {fid})"
                  log(f"Drive OK: {fid}")
                  return (f"https://drive.google.com/file/d/{fid}/view",
                          f"https://drive.google.com/uc?export=download&id={fid}")
              except Exception as e:
                  STATUS["Drive"] = "Failed"
                  ERRORS.append(f"Drive: {str(e)[:110]}")
                  log(f"Drive FAIL: {str(e)[:110]}","WARN")
                  return None, None

          def fb_story_upload(path, cap):
              if not (C["FBTOK"] and C["FBPID"]):
                  STATUS["FB"] = "Skipped (No Creds)"; return False
              try:
                  with open(path,"rb") as f:
                      r = requests.post(f"https://graph.facebook.com/v22.0/{C['FBPID']}/video_stories",
                          data={"access_token":C["FBTOK"], "description":cap},
                          files={"source":f}, timeout=650).json()
                      if r.get("id"):
                          STATUS["FB"] = f"Success (ID: {r['id']})"
                          log(f"FB Story OK: {r['id']}"); return True
                      STATUS["FB"] = f"Failed: {str(r.get('error',{}))[:65]}"
                      ERRORS.append(f"FB: {str(r.get('error',{}))[:110]}")
              except Exception as e:
                  STATUS["FB"] = "Failed"
                  ERRORS.append(f"FB: {str(e)[:110]}")
              return False

          def ig_story_upload(url, cap):
              if not (C["FBTOK"] and C["IGID"] and url):
                  STATUS["IG"] = "Skipped (No Creds/URL)"; return False
              try:
                  r = requests.post(f"https://graph.facebook.com/v22.0/{C['IGID']}/media",
                      data={"media_type":"STORIES","video_url":url,"caption":cap,
                            "access_token":C["FBTOK"]}, timeout=75).json()
                  if "error" in r:
                      STATUS["IG"] = f"Failed: {str(r['error'])[:65]}"
                      ERRORS.append(f"IG: {str(r['error'])[:110]}"); return False
                  cid = r.get("id")
                  for _ in range(75):
                      time.sleep(8)
                      st = requests.get(f"https://graph.facebook.com/v22.0/{cid}",
                          params={"fields":"status_code","access_token":C["FBTOK"]}, timeout=28).json()
                      sc = st.get("status_code")
                      if sc == "FINISHED": break
                      if sc == "ERROR":
                          STATUS["IG"] = "Failed (Processing Error)"
                          ERRORS.append("IG: Processing Error"); return False
                  p = requests.post(f"https://graph.facebook.com/v22.0/{C['IGID']}/media_publish",
                      data={"creation_id":cid,"access_token":C["FBTOK"]}, timeout=45).json()
                  if p.get("id"):
                      STATUS["IG"] = f"Success (ID: {p['id']})"
                      log(f"IG Story OK: {p['id']}"); return True
                  STATUS["IG"] = f"Failed: {str(p)[:65]}"
                  ERRORS.append(f"IG Publish: {str(p)[:110]}")
              except Exception as e:
                  STATUS["IG"] = "Failed"
                  ERRORS.append(f"IG: {str(e)[:110]}")
              return False

          # -------------------- TELEGRAM REPORT --------------------
          def send_final_report(thumb_path):
              if not (C["TG"] and C["TG_CHAT"]): return
              msg = "📊 *Sawaj Studio Bot – Story Report*\n\n"
              msg += f"📌 *Mode:* `{C['MODE'].upper()}`\n"
              msg += "━━━━━━━━━━━━━━━━━━━━\n"
              msg += f"🤖 *AI:* {STATUS['AI']}\n"
              msg += f"🎙️ *TTS:* {STATUS['TTS']}\n"
              msg += f"🎵 *Music:* {STATUS['Music']}\n"
              msg += f"🎬 *Background:* {STATUS['BG']}\n"
              msg += f"☁️ *Drive:* {STATUS['Drive']}\n"
              msg += f"📘 *Facebook:* {STATUS['FB']}\n"
              msg += f"📸 *Instagram:* {STATUS['IG']}\n"
              msg += "━━━━━━━━━━━━━━━━━━━━\n"
              if ERRORS:
                  msg += "⚠️ *Errors/Warnings:*\n"
                  for err in ERRORS[:6]:
                      msg += f"• {err}\n"
                  if len(ERRORS) > 6:
                      msg += f"• ...and {len(ERRORS)-6} more.\n"
              else:
                  msg += "✅ *All systems completed successfully.*"
              try:
                  if os.path.exists(thumb_path):
                      with open(thumb_path, 'rb') as f:
                          requests.post(f"https://api.telegram.org/bot{C['TG']}/sendPhoto",
                              data={"chat_id": C["TG_CHAT"], "caption": msg, "parse_mode": "Markdown"},
                              files={"photo": f}, timeout=40)
                  else:
                      requests.post(f"https://api.telegram.org/bot{C['TG']}/sendMessage",
                          json={"chat_id": C["TG_CHAT"], "text": msg, "parse_mode": "Markdown"}, timeout=25)
              except Exception as e:
                  log(f"Telegram report failed: {e}", "WARN")

          # -------------------- MAIN --------------------
          def main():
              log(f"SAWAJ STUDIO BOT – START (Mode: {C['MODE']})")
              sess = new_session()
              tmp = ["s_raw.mp3","s_v.mp3","s_voice.mp3","music.mp3","bg.mp4","tmp_bg.mp4","avatar.png"]
              thumb_path = "output/final/thumbnail.jpg"
              quran = ""

              try:
                  max_duration = 54.0
                  h = None
                  tarjuma = matlab = naseehah = ""
                  vd = 0.0

                  for attempt in range(7):
                      log(f"Attempt {attempt+1}: Fetching Hadith...")
                      h = fetch_hadith(sess, 17, 48)
                      log(f"Got Hadith #{h['number']} ({len(h['english'].split())} words)")

                      tarjuma, matlab, naseehah = get_hadith_and_meaning(sess, h["english"])
                      if not tarjuma:
                          tarjuma = translate(sess, h["english"])
                      if not tarjuma:
                          tarjuma = "Amal ka daromadar niyaton par hai."
                      if not naseehah:
                          naseehah = "Hamesha pure niyat ke saath kaam karein."

                      tts_text = (f"Assalamu Alaikum. Aaj ki Hadith. {tarjuma}. "
                                  f"Is Hadith ka matlab hai: {matlab}. "
                                  f"Naseehah: {naseehah}. Allah Hafiz.")
                      log(f"TTS Text length: {len(tts_text)} chars")

                      if not tts(sess, tts_text, "s_raw.mp3", "hi"):
                          log("TTS failed, retrying...", "WARN")
                          continue

                      master("s_raw.mp3", "s_v.mp3")
                      vd = MP3("s_v.mp3").info.length
                      log(f"TTS Duration: {vd:.1f}s")

                      if vd <= max_duration:
                          log(f"Perfect fit! Duration: {vd:.1f}s")
                          break
                      else:
                          log(f"Too long ({vd:.1f}s > {max_duration}s), trying another Hadith...", "WARN")

                  if vd > max_duration:
                      raise Exception("Could not find suitable Hadith within time limit.")

                  quran = fetch_quran(sess)

                  voice = "s_v.mp3"
                  if get_music(sess, "music.mp3", vd+14):
                      mix_voice_music("s_v.mp3", "music.mp3", "s_voice.mp3")
                      voice = "s_voice.mp3"

                  bg_ok = get_bg(sess, "bg.mp4", vd+5.5, "portrait")
                  if not bg_ok:
                      raise Exception("No background video found")

                  for c in ["logo.png","assets/logo.png","../logo.png","logo.jpg","assets/logo.jpg"]:
                      if os.path.exists(c):
                          try:
                              im = Image.open(c).convert("RGBA")
                              if im.width > 360:
                                  rr = 360 / im.width
                                  im = im.resize((360, int(im.height*rr)), Image.Resampling.LANCZOS)
                              b, bot = 9, 20
                              nw, nh = im.width + b*2, im.height + b + bot
                              cv = Image.new("RGBA",(nw,nh),(0,0,0,0))
                              dd = ImageDraw.Draw(cv)
                              dd.rectangle([0,0,nw-1,nh-1], outline=(212,175,55,255), width=b)
                              cv.paste(im,(b,b),im)
                              cv.save("avatar.png")
                              break
                          except: continue
                  has_logo = os.path.exists("avatar.png")

                  os.makedirs("s_frames", exist_ok=True)
                  fps, intro, outro = 25, 2.9, 3.3
                  total = intro + vd + outro
                  n = int(total * fps)
                  log(f"Rendering {n} frames at {fps} FPS...")

                  for fi in range(n):
                      t = fi / fps
                      img = Image.new("RGBA",(1080,1920),(0,0,0,0))
                      d = ImageDraw.Draw(img)
                      if t < intro:
                          draw_intro(img, d, t, intro)
                      elif t < intro + vd:
                          draw_main(img, d, t-intro, vd, tarjuma, h.get("arabic",""), h["english"],
                                    f"#{h['number']} • {h['collection']}", has_logo)
                      else:
                          draw_outro(img, d, t-(intro+vd), outro)
                      img.save(f"s_frames/frame_{fi:05d}.png")

                  os.makedirs("output/final", exist_ok=True)
                  out = "output/final/Final_Story.mp4"
                  cmd = (f'ffmpeg -y -i bg.mp4 -framerate 25 -i s_frames/frame_%05d.png -i {voice} '
                         f'-filter_complex "[0:v][1:v]overlay=0:0:shortest=1,format=yuv420p[outv]" '
                         f'-map "[outv]" -map 2:a -c:v libx264 -preset veryfast -crf 20 '
                         f'-maxrate 9.5M -bufsize 19M -c:a aac -b:a 192k -t {round(total,2)} '
                         f'-movflags +faststart {out}')
                  runc(cmd, 1900)
                  log(f"Video OK: {out}")

                  mid = min(int(n*0.42), n-1)
                  img_thumb = Image.open(f"s_frames/frame_{mid:05d}.png")
                  img_thumb.save(thumb_path, quality=93)
                  log(f"Thumbnail OK: {thumb_path}")

                  log("Uploading to Google Drive...")
                  dl_url, dd_url = drive_up(out, "Story")

                  hashtags = ("#Hadith #SahihBukhari #SahihMuslim #IslamicVideo #Quran "
                              "#HindiHadith #IslamicQuotes #Sunnah #Dawah #Islam #SawajStudio "
                              "#HadithOfTheDay #IslamicReminder")

                  caption = (f"Hadith: {tarjuma}\n\n"
                             f"Matlab: {matlab}\n\n"
                             f"Naseehah: {naseehah}\n\n"
                             f"{h.get('english','')}\n\n")
                  if quran:
                      caption += f"{quran}\n\n"
                  caption += hashtags

                  if C["MODE"] == "offline_test":
                      log("Mode = Offline Test → Skipping social media")
                      STATUS["FB"] = "Skipped (Offline Test)"
                      STATUS["IG"] = "Skipped (Offline Test)"
                  else:
                      log("Mode = Online → Uploading to Facebook + Instagram Stories")
                      fb_story_upload(out, caption)
                      if dd_url:
                          ig_story_upload(dd_url, caption)
                      else:
                          log("No Drive URL → IG Story skipped", "ERROR")
                          STATUS["IG"] = "Failed (No Drive URL)"

                  log("ALL DONE – Sawaj Studio Bot finished successfully")
              except Exception as e:
                  log(f"FATAL: {str(e)}", "ERROR")
                  ERRORS.append(f"FATAL: {str(e)}")
                  log(traceback.format_exc()[:2000], "ERROR")
              finally:
                  for f in tmp:
                      try:
                          if os.path.exists(f): os.remove(f)
                      except: pass
                  shutil.rmtree("s_frames", ignore_errors=True)
                  send_final_report(thumb_path)

          if __name__ == "__main__":
              main()
          PYEOF
          python3 Sawaj_studio_bot_story_fb_ig.py

      - name: Cleanup Workspace
        if: always()
        run: rm -rf _work
